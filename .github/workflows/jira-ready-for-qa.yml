name: Jira Ready for QA - Auto-generate Tests

# TRIGGERS
# 1. Automated: Jira fires a webhook -> repository_dispatch event
#    Jira Automation Rule:
#      Trigger: Issue transitioned to "Ready for QA"
#      Action:  Send web request POST
#        URL:   https://api.github.com/repos/yuvrajkalshetti1990-byte/AgentE2EQAWorkflow-Playwright/dispatches
#        Headers: Authorization: Bearer <GITHUB_PAT>, Content-Type: application/json
#        Body:  { "event_type": "jira-ready-for-qa", "client_payload": { "issue_key": "{{issue.key}}" } }
# 2. Manual: workflow_dispatch from GitHub Actions tab
#
# FRAMEWORK DETECTION (Row 2 fix)
#   - Reads the Jira issue labels field from the API response
#   - If label "cypress" is present  -> framework = cypress
#   - Otherwise                      -> framework = playwright  (default)
#   - Manual workflow_dispatch exposes a "framework" input to override

on:
  repository_dispatch:
    types: [jira-ready-for-qa, ready-for-qa, issue_transitioned, jira_ready_for_qa]

  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira Issue Key (e.g. SCRUM-8)'
        required: true
        type: string
      framework:
        description: 'Test framework (auto-detected from Jira label, or override here)'
        required: false
        type: choice
        default: 'auto'
        options: [auto, playwright, cypress]

env:
  ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
  ATLASSIAN_CLOUD_ID: c2269322-6897-4ede-8e92-04b6edd6edf6
  ATLASSIAN_BASE_URL: https://yuvrajkalshetti1990.atlassian.net
  ATLASSIAN_EMAIL: yuvrajkalshetti1990@gmail.com
  # AC_GATE_STRICT: set to 'true' as a repository variable (Settings > Variables) to fail the
  # pipeline when OpenAI is unavailable (prevents REWRITE-level ACs slipping through on API outages).
  # Defaults to 'false' so unset repositories are unaffected.
  AC_GATE_STRICT: ${{ vars.AC_GATE_STRICT || 'false' }}

jobs:
  generate-tests:
    name: Auto-generate tests for ${{ github.event.client_payload.issue_key || inputs.issue_key }}
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: dev
          fetch-depth: 0

      - name: "DEBUG: Pipeline inputs"
        run: |
          echo "::group::Pipeline Inputs"
          echo "Triggered by:  ${{ github.event_name }}"
          echo "Runner OS:     ${{ runner.os }}"
          echo "Run ID:        ${{ github.run_id }}"
          echo "Run URL:       https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "ISSUE_KEY:     ${ISSUE_KEY:-<empty>}"
          echo "Manual FW:     ${{ inputs.framework || '<not set>' }}"
          echo "Repo:          ${{ github.repository }}"
          echo "Ref:           ${{ github.ref }}"
          echo "SHA:           ${{ github.sha }}"
          echo "::endgroup::"
          if [[ -z "$ISSUE_KEY" ]]; then
            echo "::error::ISSUE_KEY is empty - pipeline will fail. Check Jira webhook payload or workflow_dispatch input."
          fi

      - name: Load pipeline state (re-run idempotency)
        id: pipeline_state
        run: |
          STATE_KEY=$(echo "$ISSUE_KEY" | tr '[:upper:]' '[:lower:]')
          BRANCH="auto/test-${STATE_KEY}"
          STATE_FILE="qa-framework/state/${STATE_KEY}.state.json"

          # Fetch the feature branch if it already exists to check for cached state
          git fetch origin "$BRANCH" 2>/dev/null || true

          if git show "origin/${BRANCH}:${STATE_FILE}" > /tmp/pipeline.state.json 2>/dev/null; then
            CACHED_VERDICT=$(node -e \
              "try{const s=require('/tmp/pipeline.state.json');console.log(s.acVerdict||'');}catch(e){console.log('')}" \
              2>/dev/null || echo "")
            echo "CACHED_AC_VERDICT=${CACHED_VERDICT}" >> "$GITHUB_OUTPUT"
            echo "STATE_LOADED=true"                   >> "$GITHUB_OUTPUT"
            echo "::notice::Pipeline state loaded for $ISSUE_KEY (acVerdict=${CACHED_VERDICT:-pending})"
          else
            echo "CACHED_AC_VERDICT=" >> "$GITHUB_OUTPUT"
            echo "STATE_LOADED=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existing pipeline state for $ISSUE_KEY — fresh run"
          fi

      - name: Fetch Jira story details
        id: jira
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
        run: |
          if [[ -z "$ISSUE_KEY" ]]; then
            echo "ERROR: ISSUE_KEY is empty. Ensure the Jira webhook sends client_payload.issue_key or use workflow_dispatch with issue_key input."
            exit 1
          fi

          echo "::group::Jira API Request"
          echo "Endpoint: GET /rest/api/3/issue/$ISSUE_KEY?fields=summary,description,status,labels"
          echo "Cloud ID: $ATLASSIAN_CLOUD_ID"
          echo "User:     $ATLASSIAN_EMAIL"
          echo "::endgroup::"

          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          HTTP_CODE=$(curl --noproxy '*' -s -o /tmp/jira_response.json -w "%{http_code}" \
            -H "Authorization: Basic $AUTH" \
            -H "Accept: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY?fields=summary,description,status,labels")

          echo "::group::Jira API Response (HTTP $HTTP_CODE)"
          echo "HTTP status: $HTTP_CODE"
          # Print response but redact any potential token echoes; summary/status are safe
          cat /tmp/jira_response.json | jq '{key: .key, summary: .fields.summary, status: .fields.status.name, labels: .fields.labels, descriptionLength: (.fields.description | tostring | length)}' 2>/dev/null || cat /tmp/jira_response.json
          echo "::endgroup::"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Jira API returned HTTP $HTTP_CODE for issue $ISSUE_KEY"
            exit 1
          fi

          RESPONSE=$(cat /tmp/jira_response.json)

          SUMMARY=$(echo "$RESPONSE" | jq -r '.fields.summary')
          STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name')
          LABELS=$(echo "$RESPONSE" | jq -r '.fields.labels[]?' | tr '\n' ',')

          # Detect framework: manual override > Jira label > default playwright
          MANUAL_FW="${{ inputs.framework }}"
          if [[ "$MANUAL_FW" == "cypress" ]]; then
            FRAMEWORK="cypress"
          elif [[ "$MANUAL_FW" == "playwright" ]]; then
            FRAMEWORK="playwright"
          else
            # Auto-detect from Jira labels — fail loudly on ambiguous dual-label
            HAS_CYPRESS=$(echo "$LABELS"    | grep -qi "cypress"    && echo "true" || echo "false")
            HAS_PLAYWRIGHT=$(echo "$LABELS" | grep -qi "playwright" && echo "true" || echo "false")
            if [[ "$HAS_CYPRESS" == "true" && "$HAS_PLAYWRIGHT" == "true" ]]; then
              echo "::error::FRAMEWORK_AMBIGUOUS: ${ISSUE_KEY} has both 'cypress' and 'playwright' labels. Remove one label or use the 'framework' workflow_dispatch input to override."
              exit 1
            elif [[ "$HAS_CYPRESS" == "true" ]]; then
              FRAMEWORK="cypress"
            else
              FRAMEWORK="playwright"
            fi
          fi

          echo "ISSUE_SUMMARY=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "ISSUE_STATUS=$STATUS"   >> "$GITHUB_OUTPUT"
          echo "FRAMEWORK=$FRAMEWORK"   >> "$GITHUB_OUTPUT"

          echo "::notice::Jira=${ISSUE_KEY} | Summary=${SUMMARY} | Status=${STATUS} | Framework=${FRAMEWORK} | Labels=${LABELS}"

      - name: Review AC quality with OpenAI
        id: ac_review
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Short-circuit: if AC verdict is already cached from a previous run, skip the OpenAI call
          CACHED="${{ steps.pipeline_state.outputs.CACHED_AC_VERDICT }}"
          if [[ -n "$CACHED" && "$CACHED" != "null" ]]; then
            echo "::notice::AC verdict already cached ($CACHED) — skipping OpenAI review on re-run (saves API cost)"
            echo "SCORE=cached"    >> "$GITHUB_OUTPUT"
            echo "VERDICT=$CACHED" >> "$GITHUB_OUTPUT"
            echo "SUMMARY=AC review loaded from cached pipeline state (verdict from initial run)." >> "$GITHUB_OUTPUT"
            echo "ISSUES="         >> "$GITHUB_OUTPUT"
            echo "SUGGESTIONS="    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)

          # Fetch full description (ATC text lives here)
          HTTP_CODE=$(curl --noproxy '*' -s -o /tmp/jira_desc.json -w "%{http_code}" \
            -H "Authorization: Basic $AUTH" \
            -H "Accept: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY?fields=description")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "ERROR: Jira description fetch returned HTTP $HTTP_CODE"
            cat /tmp/jira_desc.json
            exit 1
          fi

          DESC=$(cat /tmp/jira_desc.json \
            | jq -r '
                def extract_text: . as $node |
                  if type == "array" then map(extract_text) | add // ""
                  elif type == "object" then
                    if .type == "text" then .text // ""
                    else (.content // [] | map(extract_text) | add // "")
                    end
                  else ""
                  end;
                .fields.description | extract_text')

          if [[ -z "$DESC" || "$DESC" == "null" ]]; then
            echo "::warning::No description/ACs found on $ISSUE_KEY — setting REWRITE verdict"
            echo "SCORE=0"           >> "$GITHUB_OUTPUT"
            echo "VERDICT=REWRITE"   >> "$GITHUB_OUTPUT"
            echo "FEEDBACK=No description or acceptance criteria found on this Jira story. Please add ACs before moving to Ready for QA." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::AC Description Extracted"
          echo "Description length: ${#DESC} characters"
          echo "First 400 chars:"
          echo "${DESC:0:400}"
          echo "::endgroup::"

          # Build OpenAI request
          PROMPT=$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n\n%s\n%s\n' \
            'You are an expert QA engineer reviewing acceptance criteria (ACs) for test automation feasibility.' \
            'Score the following Jira story description. Extract each AC and score it 1-5 on:' \
            '- Specific (exact values/messages vs vague language)' \
            '- Verifiable (clear pass/fail a script can assert vs should work)' \
            '- Scoped (one behaviour vs compound)' \
            '- Data-independent (works with test data vs requires specific live data)' \
            'Overall score = average of all individual AC averages.' \
            'Verdict rules:' \
            '- 4.0-5.0: AUTOMATE (ready as-is)' \
            '- 3.0-3.9: IMPROVE (minor fixes needed, proceed with warnings)' \
            '- 1.0-2.9: REWRITE (too vague, pipeline should be blocked)' \
            'Return ONLY valid JSON: {"score":<1.0-5.0>,"verdict":"AUTOMATE|IMPROVE|REWRITE","summary":"<assessment>","issues":["<i1>"],"suggestions":["<s1>"]}' \
            'Story description:' \
            "$DESC")

          # Call OpenAI — capture HTTP code separately so we can diagnose failures
          echo "::group::OpenAI API Request"
          echo "Model:    gpt-4o-mini"
          echo "Endpoint: https://api.openai.com/v1/chat/completions"
          echo "Prompt length: ${#PROMPT} characters"
          echo "::endgroup::"

          HTTP_CODE=$(curl --noproxy '*' -s -o /tmp/openai_response.json -w "%{http_code}" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.openai.com/v1/chat/completions \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"temperature\": 0,
              \"messages\": [{\"role\": \"user\", \"content\": $(echo "$PROMPT" | jq -Rs .)}]
            }")

          echo "OpenAI HTTP status: $HTTP_CODE"

          echo "::group::OpenAI API Response (HTTP $HTTP_CODE)"
          cat /tmp/openai_response.json | jq '{model: .model, usage: .usage, finish_reason: .choices[0].finish_reason, content_length: (.choices[0].message.content | length)}' 2>/dev/null || echo "(raw)" && cat /tmp/openai_response.json
          echo "::endgroup::"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "WARNING: OpenAI API returned HTTP $HTTP_CODE — proceeding with IMPROVE verdict"
            cat /tmp/openai_response.json
            echo "SCORE=N/A"   >> "$GITHUB_OUTPUT"
            echo "VERDICT=IMPROVE" >> "$GITHUB_OUTPUT"
            echo "SUMMARY=⚠️ AC review could not be completed — OpenAI API returned HTTP $HTTP_CODE. Please review ACs manually before proceeding. Pipeline continuing with IMPROVE verdict." >> "$GITHUB_OUTPUT"
            echo "ISSUES=• OpenAI API unavailable (HTTP $HTTP_CODE)" >> "$GITHUB_OUTPUT"
            echo "SUGGESTIONS=• Retry by moving story back to Ready for QA once API is available" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(cat /tmp/openai_response.json)

          # Validate response is parseable JSON
          if ! echo "$RESPONSE" | jq empty 2>/dev/null; then
            echo "WARNING: OpenAI returned non-JSON — proceeding with IMPROVE verdict"
            echo "$RESPONSE"
            echo "SCORE=N/A"   >> "$GITHUB_OUTPUT"
            echo "VERDICT=IMPROVE" >> "$GITHUB_OUTPUT"
            echo "SUMMARY=⚠️ AC review could not be completed — OpenAI returned an unreadable response. Please review ACs manually. Pipeline continuing with IMPROVE verdict." >> "$GITHUB_OUTPUT"
            echo "ISSUES=• OpenAI response was not valid JSON" >> "$GITHUB_OUTPUT"
            echo "SUGGESTIONS=• Retry by moving story back to Ready for QA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract and validate AI content field
          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [[ -z "$AI_CONTENT" ]]; then
            echo "WARNING: OpenAI response missing content field — proceeding with IMPROVE verdict"
            echo "$RESPONSE" | jq .
            echo "SCORE=N/A"   >> "$GITHUB_OUTPUT"
            echo "VERDICT=IMPROVE" >> "$GITHUB_OUTPUT"
            echo "SUMMARY=⚠️ AC review could not be completed — OpenAI returned an empty response. Please review ACs manually. Pipeline continuing with IMPROVE verdict." >> "$GITHUB_OUTPUT"
            echo "ISSUES=• OpenAI content field was empty" >> "$GITHUB_OUTPUT"
            echo "SUGGESTIONS=• Retry by moving story back to Ready for QA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip markdown code fences OpenAI sometimes wraps JSON in (```json ... ```)
          AI_CLEAN=$(echo "$AI_CONTENT" | sed 's/```json//g' | sed 's/```//g' | tr -d '\r' | sed '/^[[:space:]]*$/d')

          # Parse — fallback to safe defaults if still unparseable
          AI_JSON=$(echo "$AI_CLEAN" | jq . 2>/dev/null)
          if [[ -z "$AI_JSON" || "$AI_JSON" == "null" ]]; then
            echo "WARNING: Could not parse OpenAI content as JSON after stripping markdown. Raw content:"
            echo "$AI_CONTENT"
            AI_JSON='{"score":"3.0","verdict":"IMPROVE","summary":"AC review completed but response could not be parsed. Please review ACs manually.","issues":[],"suggestions":[]}'
          fi

          SCORE=$(echo "$AI_JSON"    | jq -r '.score    // "3.0"')
          VERDICT=$(echo "$AI_JSON"  | jq -r '.verdict  // "IMPROVE"')
          SUMMARY=$(echo "$AI_JSON"  | jq -r '.summary  // "Review completed."')
          ISSUES=$(echo "$AI_JSON"   | jq -r '.issues[]? // empty' | sed 's/^/• /' | tr '\n' '|')
          SUGGESTIONS=$(echo "$AI_JSON" | jq -r '.suggestions[]? // empty' | sed 's/^/• /' | tr '\n' '|')

          echo "SCORE=$SCORE"           >> "$GITHUB_OUTPUT"
          echo "VERDICT=$VERDICT"       >> "$GITHUB_OUTPUT"
          echo "SUMMARY=$SUMMARY"       >> "$GITHUB_OUTPUT"
          echo "ISSUES=$ISSUES"         >> "$GITHUB_OUTPUT"
          echo "SUGGESTIONS=$SUGGESTIONS" >> "$GITHUB_OUTPUT"

          echo "::group::AC Review Result"
          echo "Score:      $SCORE / 5.0"
          echo "Verdict:    $VERDICT"
          echo "Summary:    $SUMMARY"
          echo "Issues:     $ISSUES"
          echo "Suggestions:$SUGGESTIONS"
          echo "::endgroup::"
          echo "::notice::AC Review: score=${SCORE} verdict=${VERDICT}"

      - name: "Strict gate: fail when OpenAI AC review was skipped"
        # Runs only when SCORE is 'N/A' (set by all OpenAI fallback paths) AND strict mode is on.
        # Set AC_GATE_STRICT=true as a repository variable (Settings > Variables) to enable.
        # Default is false so existing pipelines are unaffected.
        if: steps.ac_review.outputs.SCORE == 'N/A' && env.AC_GATE_STRICT == 'true'
        run: |
          echo "::error::AC_GATE_STRICT is enabled and the OpenAI AC review was skipped (API unavailable)."
          echo "::error::Manual AC review is required before automation can proceed for ${ISSUE_KEY}."
          echo "Re-trigger this pipeline once the OpenAI API is available, or set AC_GATE_STRICT=false to allow soft-fail."
          exit 1

      - name: Post AC review comment to Jira
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          SCORE: ${{ steps.ac_review.outputs.SCORE }}
          VERDICT: ${{ steps.ac_review.outputs.VERDICT }}
          SUMMARY: ${{ steps.ac_review.outputs.SUMMARY }}
          ISSUES: ${{ steps.ac_review.outputs.ISSUES }}
          SUGGESTIONS: ${{ steps.ac_review.outputs.SUGGESTIONS }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)

          # Convert pipe-delimited text into a JSON array of ADF listItem nodes.
          # Returns '[]' when input is empty — avoids invalid empty bulletList.
          make_list_items() {
            echo "$1" | tr '|' '\n' | grep -v '^$' | \
              jq -Rc '{"type":"listItem","content":[{"type":"paragraph","content":[{"type":"text","text":.}]}]}' | \
              jq -sc '.'
          }

          ISSUE_ITEMS=$(make_list_items "$ISSUES")
          SUGGESTION_ITEMS=$(make_list_items "$SUGGESTIONS")

          # Build the full ADF document body using jq — handles all special-char escaping.
          # Bullet-list sections are omitted entirely when they have no items.
          BODY=$(jq -n \
            --arg score "$SCORE" \
            --arg verdict "$VERDICT" \
            --arg summary "$SUMMARY" \
            --argjson issue_items "$ISSUE_ITEMS" \
            --argjson suggestion_items "$SUGGESTION_ITEMS" \
            '
            def section(heading; items):
              if (items | length) > 0 then
                [
                  {"type":"heading","attrs":{"level":4},"content":[{"type":"text","text":heading}]},
                  {"type":"bulletList","content":items}
                ]
              else [] end;

            {
              "body": {
                "version": 1, "type": "doc",
                "content": (
                  [
                    {"type":"heading","attrs":{"level":3},"content":[{"type":"text","text":"AC Automation Feasibility Review"}]},
                    {"type":"paragraph","content":[{"type":"text","text":("Score: " + $score + " / 5.0  |  Verdict: " + $verdict),"marks":[{"type":"strong"}]}]},
                    {"type":"paragraph","content":[{"type":"text","text":$summary}]}
                  ]
                  + section("Issues Found"; $issue_items)
                  + section("Suggestions"; $suggestion_items)
                )
              }
            }
            ')

          curl --noproxy '*' -sf -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/comment" \
            -d "$BODY"
          echo "AC review comment posted to $ISSUE_KEY"

      - name: Block pipeline and move to In Progress if ACs need rewrite
        if: steps.ac_review.outputs.VERDICT == 'REWRITE'
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          # Transition back to In Progress (ID 21)
          curl --noproxy '*' -sf -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/transitions" \
            -d '{"transition": {"id": "21"}}'
          echo "Story moved back to In Progress — ACs require rewrite before automation can proceed."
          exit 1

      - name: Enrich ACs (Test Intelligence Layer)
        id: intelligence
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          FRAMEWORK: ${{ steps.jira.outputs.FRAMEWORK }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)

          # Fetch description to extract raw ACs
          HTTP_CODE=$(curl --noproxy '*' -s -o /tmp/jira_desc_intel.json -w "%{http_code}" \
            -H "Authorization: Basic $AUTH" \
            -H "Accept: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY?fields=description")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Could not fetch Jira description for enrichment (HTTP $HTTP_CODE) — skipping intelligence layer"
            echo "INTELLIGENCE_ACTION=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract plain text description
          DESC=$(cat /tmp/jira_desc_intel.json \
            | jq -r '
                def extract_text: . as $node |
                  if type == "array" then map(extract_text) | add // ""
                  elif type == "object" then
                    if .type == "text" then .text // ""
                    else (.content // [] | map(extract_text) | add // "")
                    end
                  else ""
                  end;
                .fields.description | extract_text')

          if [[ -z "$DESC" || "$DESC" == "null" ]]; then
            echo "::warning::No description found — skipping AC enrichment"
            echo "INTELLIGENCE_ACTION=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Split description into individual AC lines (lines starting with AC or numbered)
          # Write to a JSON array file for enrich-ac.js --acs-file
          echo "$DESC" | \
            grep -E '^\s*(AC[-: ]?\s*\d+|[0-9]+\.)' | \
            sed 's/^\s*//' | \
            jq -Rsc '[split("\n")[] | select(length > 0)]' \
            > /tmp/acs.json

          AC_COUNT=$(jq 'length' /tmp/acs.json)
          echo "ACs extracted for enrichment: $AC_COUNT"

          if [[ "$AC_COUNT" -eq 0 ]]; then
            # Fallback: treat whole description as one AC
            echo "[\"$DESC\"]" | jq . > /tmp/acs.json
            AC_COUNT=1
          fi

          mkdir -p qa-framework/intelligence

          # Run enrichment — exit 2 = REWRITE verdict (should not reach here — blocked above)
          set +e
          node scripts/enrich-ac.js \
            --story-key  "$ISSUE_KEY" \
            --acs-file   /tmp/acs.json \
            --framework  "$FRAMEWORK"
          ENRICH_EXIT=$?
          set -e

          INTEL_FILE="qa-framework/intelligence/${ISSUE_KEY}-enhanced-ac.json"
          if [[ -f "$INTEL_FILE" ]]; then
            PIPELINE_ACTION=$(jq -r '.pipelineAction' "$INTEL_FILE")
            AUTOMATABLE=$(jq '[.enriched[] | select(.automatable == true)] | length' "$INTEL_FILE")
            TOTAL=$(jq '.enriched | length' "$INTEL_FILE")
            echo "::group::AC Intelligence Summary"
            echo "Pipeline action:  $PIPELINE_ACTION"
            echo "Automatable ACs:  $AUTOMATABLE / $TOTAL"
            jq -r '.enriched[] | "  AC-\(.acNumber) [\(.verdict)] automatable=\(.automatable)\(if .nonAutomatableReason then " → NOT AUTOMATABLE: " + .nonAutomatableReason else "" end)"' "$INTEL_FILE"
            echo "::endgroup::"
            echo "INTELLIGENCE_ACTION=$PIPELINE_ACTION" >> "$GITHUB_OUTPUT"
            echo "AUTOMATABLE_COUNT=$AUTOMATABLE"       >> "$GITHUB_OUTPUT"
            echo "TOTAL_AC_COUNT=$TOTAL"                >> "$GITHUB_OUTPUT"
            echo "::notice::Intelligence layer: $PIPELINE_ACTION ($AUTOMATABLE/$TOTAL ACs automatable)"
          else
            echo "::warning::Intelligence output not found — proceeding without enrichment"
            echo "INTELLIGENCE_ACTION=skipped" >> "$GITHUB_OUTPUT"
          fi

          if [[ $ENRICH_EXIT -eq 2 ]]; then
            echo "::error::One or more ACs have REWRITE verdict — pipeline should have been blocked above"
            exit 1
          fi

      - name: Create feature branch
        id: branch
        run: |
          BRANCH="auto/test-$(echo "$ISSUE_KEY" | tr '[:upper:]' '[:lower:]')"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists - checking out"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            echo "Branch $BRANCH pushed to remote"
          fi

          echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"

          echo "::group::Branch Debug"
          echo "Branch: $BRANCH"
          echo "Active branch: $(git branch --show-current)"
          git log --oneline -3 || true
          echo "::endgroup::"
          echo "::notice::Branch ready: $BRANCH"

      - name: Create GitHub Issue for Copilot
        id: gh_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          JIRA_SUMMARY="${{ steps.jira.outputs.ISSUE_SUMMARY }}"
          FRAMEWORK="${{ steps.jira.outputs.FRAMEWORK }}"
          gh label create "automated-qa" --color "#0075ca" --description "Automated QA test generation" 2>/dev/null || true
          gh label create "framework:playwright" --color "#45ba4b" --description "Playwright tests" 2>/dev/null || true
          gh label create "framework:cypress" --color "#04c38e" --description "Cypress tests" 2>/dev/null || true

          # Idempotency: check if an issue already exists for this Jira key + branch.
          # Re-running the workflow must NOT create a duplicate GitHub issue.
          EXISTING_ISSUE=$(gh issue list \
            --label "automated-qa" \
            --search "[$ISSUE_KEY] Automate:" \
            --json number,url \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "$EXISTING_ISSUE" && "$EXISTING_ISSUE" != "null" ]]; then
            echo "GitHub issue #$EXISTING_ISSUE already exists for $ISSUE_KEY — reusing"
            ISSUE_URL=$(gh issue view "$EXISTING_ISSUE" --json url --jq '.url')
            echo "ISSUE_NUMBER=$EXISTING_ISSUE" >> "$GITHUB_OUTPUT"
            echo "ISSUE_URL=$ISSUE_URL"         >> "$GITHUB_OUTPUT"
            echo "::notice::Reusing GitHub issue #${EXISTING_ISSUE}: ${ISSUE_URL}"
            exit 0
          fi

          # --- Shared instruction block (AC traceability + intelligence layer) ---
          # Built with printf to avoid heredoc YAML parsing issues
          INTEL_FILE="qa-framework/intelligence/${ISSUE_KEY}-enhanced-ac.json"
          INTEL_NOTE=""
          if [[ -f "$INTEL_FILE" ]]; then
            AUTOMATABLE="${{ steps.intelligence.outputs.AUTOMATABLE_COUNT }}"
            TOTAL="${{ steps.intelligence.outputs.TOTAL_AC_COUNT }}"
            INTEL_NOTE=$(printf '\n### Test Intelligence Layer\nEnhanced AC document available at `%s`\n- Automatable ACs: %s / %s\n- Use `enriched[n].assertionHints` for assertion snippets\n- Use `enriched[n].edgeCases` for additional test scenarios\n- ACs with `automatable=false` must be moved to notimplemented/' \
              "$INTEL_FILE" "$AUTOMATABLE" "$TOTAL")
          fi

          AC_TRACEABILITY=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            '' \
            '### AC Traceability Requirements (MANDATORY)' \
            '- Each test file MUST open with a comment block: Jira key + all AC texts' \
            '- Each test() / it() MUST have a comment above it referencing its AC number' \
            '- Format: `// AC-1: <exact AC text from Jira>`' \
            '- One test per AC — 1:1 mapping, do NOT merge multiple ACs into one test' \
            '- If an AC cannot be automated (non-UI, missing selector, ambiguous):' \
            '    create a stub at qa-framework/notimplemented/{issue-key-lower}-ac-{n}.notimplemented.spec.ts' \
            '    document the reason and missing pieces — do NOT silently skip')

          if [[ "$FRAMEWORK" == "cypress" ]]; then
            printf '## Automation Task\n\n**Jira Story:** [%s](%s/browse/%s)\n**Branch:** `%s`\n**Framework:** Cypress\n\n## Agent Instructions\n\nGenerate Cypress TypeScript E2E tests for ALL acceptance criteria in the Jira story.\n\n### File Conventions\n- Place files under `qa-framework/frameworks/cypress/tests/%s/`\n- Config: `qa-framework/frameworks/cypress/cypress.config.ts`\n- Naming: `{app-prefix}-cy-{area}-{seq:02d}-{kebab-description}.cy.ts`\n- One `it()` per acceptance criterion (1:1 AC → test mapping)\n- Selectors: prefer [data-cy], [data-testid], ARIA roles\n- Use `cy.session()` for login state caching\n- Use `cy.intercept()` for network stubbing/waiting\n%s\n%s\n\nCommit all test files to branch `%s`\n' \
              "$ISSUE_KEY" "$ATLASSIAN_BASE_URL" "$ISSUE_KEY" "$BRANCH" \
              "$(echo "$ISSUE_KEY" | tr '[:upper:]' '[:lower:]')" \
              "$AC_TRACEABILITY" \
              "$INTEL_NOTE" \
              "$BRANCH" \
              > /tmp/issue_body.md
            FRAMEWORK_LABEL="framework:cypress"
          else
            printf '## Automation Task\n\n**Jira Story:** [%s](%s/browse/%s)\n**Branch:** `%s`\n**Framework:** Playwright\n\n## Agent Instructions\n\nGenerate Playwright TypeScript E2E tests for ALL acceptance criteria in the Jira story.\n\n### File Conventions\n- Place files under `qa-framework/frameworks/playwright/tests/%s/`\n- Config: `qa-framework/frameworks/playwright/playwright.config.ts`\n- Naming: `saucedemo-tc-{area}-{seq:02d}-{kebab-description}.spec.ts`\n- One `test()` per acceptance criterion (1:1 AC → test mapping)\n- Selectors: prefer [data-test], ARIA roles, [name] attributes\n- Use timestamp suffixes for dynamic test data\n%s\n%s\n\nCommit all test files to branch `%s`\n' \
              "$ISSUE_KEY" "$ATLASSIAN_BASE_URL" "$ISSUE_KEY" "$BRANCH" \
              "$(echo "$ISSUE_KEY" | tr '[:upper:]' '[:lower:]')" \
              "$AC_TRACEABILITY" \
              "$INTEL_NOTE" \
              "$BRANCH" \
              > /tmp/issue_body.md
            FRAMEWORK_LABEL="framework:playwright"
          fi

          ISSUE_URL=$(gh issue create \
            --title "[$ISSUE_KEY] Automate: $JIRA_SUMMARY" \
            --label "automated-qa" \
            --label "$FRAMEWORK_LABEL" \
            --body-file /tmp/issue_body.md)
          echo "$ISSUE_URL"
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oP '(?<=/issues/)\d+')
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ISSUE_URL=$ISSUE_URL"       >> "$GITHUB_OUTPUT"

          echo "::group::GitHub Issue Created"
          echo "Issue #$ISSUE_NUMBER: $ISSUE_URL"
          echo "Title: [$ISSUE_KEY] Automate: $JIRA_SUMMARY"
          echo "Framework label: $FRAMEWORK_LABEL"
          echo "::endgroup::"
          echo "::notice::GitHub issue created: #${ISSUE_NUMBER} ${ISSUE_URL}"

      - name: Assign Copilot to GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.gh_issue.outputs.ISSUE_NUMBER }} \
            --add-assignee "Copilot" 2>/dev/null || true

      - name: Persist pipeline state to feature branch
        if: steps.branch.outputs.BRANCH != '' && steps.ac_review.outputs.VERDICT != 'REWRITE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          FRAMEWORK="${{ steps.jira.outputs.FRAMEWORK }}"

          # Ensure we are on the feature branch (branch step already checked it out).
          # No || true — a failed checkout must surface immediately to prevent committing state to the wrong branch.
          git checkout "$BRANCH"

          # Sync scripts/ from dev onto the feature branch in case the branch pre-dates
          # the addition of state.js or other pipeline scripts (fixes MODULE_NOT_FOUND errors).
          git checkout origin/dev -- scripts/ 2>/dev/null || true

          # Write/update state file using the plain-JS CLI (no npm install needed)
          node scripts/state.js init "$ISSUE_KEY" "$FRAMEWORK" "$BRANCH"
          node scripts/state.js set  "$ISSUE_KEY" acVerdict "${{ steps.ac_review.outputs.VERDICT }}"

          SCORE="${{ steps.ac_review.outputs.SCORE }}"
          [[ -n "$SCORE" && "$SCORE" != "cached" ]] && \
            node scripts/state.js set "$ISSUE_KEY" acScore "$SCORE"

          ISSUE_NUM="${{ steps.gh_issue.outputs.ISSUE_NUMBER }}"
          [[ -n "$ISSUE_NUM" ]] && \
            node scripts/state.js set "$ISSUE_KEY" githubIssueNumber "$ISSUE_NUM"

          node scripts/state.js set "$ISSUE_KEY" jiraStatus "in-qa"

          echo "::group::Pipeline state contents"
          node scripts/state.js get "$ISSUE_KEY"
          echo "::endgroup::"

          # Commit state + intelligence file so subsequent runs and generators can read them
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qa-framework/state/
          # Stage intelligence output if it was produced
          INTEL_FILE="qa-framework/intelligence/${ISSUE_KEY}-enhanced-ac.json"
          [[ -f "$INTEL_FILE" ]] && git add "$INTEL_FILE"
          git diff --cached --quiet || {
            git commit -m "chore(intelligence): persist pipeline state + enriched ACs for $ISSUE_KEY [skip ci]"
            git push origin "$BRANCH"
            echo "::notice::Pipeline state and AC intelligence committed to $BRANCH"
          }

      - name: Transition Jira issue to In QA
        continue-on-error: true  # 400/409 means issue is already in that state — not an error
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          HTTP=$(curl --noproxy '*' -s -o /tmp/jira_transition.json -w "%{http_code}" -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/transitions" \
            -d '{"transition": {"id": "41"}}')
          if [[ "$HTTP" == "204" ]]; then
            echo "Jira $ISSUE_KEY transitioned to In QA"
            echo "::notice::Jira ${ISSUE_KEY} → In QA (HTTP 204)"
          elif [[ "$HTTP" == "400" || "$HTTP" == "409" ]]; then
            echo "Jira $ISSUE_KEY already in correct state (HTTP $HTTP) — continuing"
            echo "::notice::Jira ${ISSUE_KEY} already in correct state (HTTP ${HTTP})"
          else
            echo "::warning::Jira transition returned HTTP $HTTP — check transition IDs"
            cat /tmp/jira_transition.json
          fi

      - name: Comment on Jira issue
        continue-on-error: true  # Non-blocking — comment failure must not abort the pipeline
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.BRANCH }}
          GH_ISSUE_URL: ${{ steps.gh_issue.outputs.ISSUE_URL }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          FRAMEWORK="${{ steps.jira.outputs.FRAMEWORK }}"
          COMMENT_TEXT="✅ Automation pipeline triggered [$FRAMEWORK]. Copilot is generating tests on branch \`$BRANCH\`. GitHub Issue: $GH_ISSUE_URL"
          HTTP=$(curl --noproxy '*' -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/comment" \
            -d "{\"body\":{\"version\":1,\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":$(echo \"$COMMENT_TEXT\" | jq -R .)}]}]}}")
          echo "Jira comment HTTP status: $HTTP"

      - name: Trigger CI tests on feature branch
        continue-on-error: true   # GITHUB_TOKEN cannot dispatch workflow_dispatch (platform restriction).
                                  # playwright.yml / cypress.yml auto-triggers on Copilot's push to auto/** anyway.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.BRANCH }}
          FRAMEWORK: ${{ steps.jira.outputs.FRAMEWORK }}
        run: |
          # Explicitly dispatch the correct CI workflow via GitHub API.
          # GITHUB_TOKEN push suppresses push events so we trigger via workflow_dispatch instead.
          # Requires actions: write permission (set in job-level permissions block above).
          if [[ "$FRAMEWORK" == "cypress" ]]; then
            WORKFLOW_FILE="cypress.yml"
          else
            WORKFLOW_FILE="playwright.yml"
          fi

          # Dispatch with ref=dev so GitHub reads the latest workflow file from dev.
          # Pass inputs.ref=$BRANCH so the checkout inside cypress/playwright.yml still
          # checks out the feature branch code. Without this, GitHub uses the workflow
          # file from auto/test-* which may predate recent pipeline fixes.
          HTTP_CODE=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -d "{\"ref\":\"dev\",\"inputs\":{\"ref\":\"$BRANCH\"}}")

          echo "::group::CI Dispatch Response (HTTP $HTTP_CODE)"
          echo "Workflow: $WORKFLOW_FILE"
          echo "Branch:   $BRANCH"
          echo "HTTP:     $HTTP_CODE"
          cat /tmp/dispatch_response.json 2>/dev/null || echo "(empty body — 204 expected)"
          echo "::endgroup::"

          if [[ "$HTTP_CODE" != "204" ]]; then
            echo "::warning::workflow dispatch returned HTTP $HTTP_CODE — CI will still auto-trigger on Copilot push"
          else
            echo "::notice::${FRAMEWORK} CI workflow (${WORKFLOW_FILE}) dispatched on branch ${BRANCH}"
            echo "$FRAMEWORK CI workflow ($WORKFLOW_FILE) triggered on $BRANCH (HTTP $HTTP_CODE)"
          fi

      - name: "DEBUG: Pipeline summary"
        if: always()
        run: |
          echo "::group::Pipeline Run Summary"
          echo "============================================================"
          echo "  Jira Issue:     ${ISSUE_KEY}"
          echo "  Summary:        ${{ steps.jira.outputs.ISSUE_SUMMARY }}"
          echo "  Jira Status:    ${{ steps.jira.outputs.ISSUE_STATUS }}"
          echo "  Framework:      ${{ steps.jira.outputs.FRAMEWORK }}"
          echo "  AC Score:       ${{ steps.ac_review.outputs.SCORE }}"
          echo "  AC Verdict:     ${{ steps.ac_review.outputs.VERDICT }}"
          echo "  Branch:         ${{ steps.branch.outputs.BRANCH }}"
          echo "  GitHub Issue:   #${{ steps.gh_issue.outputs.ISSUE_NUMBER }} ${{ steps.gh_issue.outputs.ISSUE_URL }}"
          echo "  Run URL:        https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================================"
          echo "::endgroup::"
