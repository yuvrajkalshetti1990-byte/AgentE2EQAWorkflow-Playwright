name: Jira Ready for QA - Auto-generate Tests

# TRIGGERS
# 1. Automated: Jira fires a webhook -> repository_dispatch event
#    Jira Automation Rule:
#      Trigger: Issue transitioned to "Ready for QA"
#      Action:  Send web request POST
#        URL:   https://api.github.com/repos/yuvrajkalshetti1990-byte/AgentE2EQAWorkflow-Playwright/dispatches
#        Headers: Authorization: Bearer <GITHUB_PAT>, Content-Type: application/json
#        Body:  { "event_type": "jira-ready-for-qa", "client_payload": { "issue_key": "{{issue.key}}" } }
# 2. Manual: workflow_dispatch from GitHub Actions tab
#
# FRAMEWORK DETECTION (Row 2 fix)
#   - Reads the Jira issue labels field from the API response
#   - If label "cypress" is present  -> framework = cypress
#   - Otherwise                      -> framework = playwright  (default)
#   - Manual workflow_dispatch exposes a "framework" input to override

on:
  repository_dispatch:
    types: [jira-ready-for-qa, ready-for-qa, issue_transitioned, jira_ready_for_qa]

  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira Issue Key (e.g. SCRUM-8)'
        required: true
        type: string
      framework:
        description: 'Test framework (auto-detected from Jira label, or override here)'
        required: false
        type: choice
        default: 'auto'
        options: [auto, playwright, cypress]

env:
  ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
  ATLASSIAN_CLOUD_ID: c2269322-6897-4ede-8e92-04b6edd6edf6
  ATLASSIAN_BASE_URL: https://yuvrajkalshetti1990.atlassian.net
  ATLASSIAN_EMAIL: yuvrajkalshetti1990@gmail.com

jobs:
  generate-tests:
    name: Auto-generate tests for ${{ github.event.client_payload.issue_key || inputs.issue_key }}
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: dev
          fetch-depth: 0

      - name: Fetch Jira story details
        id: jira
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
        run: |
          if [[ -z "$ISSUE_KEY" ]]; then
            echo "ERROR: ISSUE_KEY is empty. Ensure the Jira webhook sends client_payload.issue_key or use workflow_dispatch with issue_key input."
            exit 1
          fi

          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          HTTP_CODE=$(curl --noproxy '*' -s -o /tmp/jira_response.json -w "%{http_code}" \
            -H "Authorization: Basic $AUTH" \
            -H "Accept: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY?fields=summary,description,status,labels")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "ERROR: Jira API returned HTTP $HTTP_CODE for issue $ISSUE_KEY"
            cat /tmp/jira_response.json
            exit 1
          fi

          RESPONSE=$(cat /tmp/jira_response.json)

          SUMMARY=$(echo "$RESPONSE" | jq -r '.fields.summary')
          STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name')
          LABELS=$(echo "$RESPONSE" | jq -r '.fields.labels[]?' | tr '\n' ',')

          # Detect framework: manual override > Jira label > default playwright
          MANUAL_FW="${{ inputs.framework }}"
          if [[ "$MANUAL_FW" == "cypress" ]]; then
            FRAMEWORK="cypress"
          elif [[ "$MANUAL_FW" == "playwright" ]]; then
            FRAMEWORK="playwright"
          elif echo "$LABELS" | grep -qi "cypress"; then
            FRAMEWORK="cypress"
          else
            FRAMEWORK="playwright"
          fi

          echo "ISSUE_SUMMARY=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "ISSUE_STATUS=$STATUS"   >> "$GITHUB_OUTPUT"
          echo "FRAMEWORK=$FRAMEWORK"   >> "$GITHUB_OUTPUT"

          echo "Jira Issue: $ISSUE_KEY"
          echo "Summary:    $SUMMARY"
          echo "Status:     $STATUS"
          echo "Labels:     $LABELS"
          echo "Framework:  $FRAMEWORK"

      - name: Review AC quality with OpenAI
        id: ac_review
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)

          # Fetch full description (ATC text lives here)
          HTTP_CODE=$(curl --noproxy '*' -s -o /tmp/jira_desc.json -w "%{http_code}" \
            -H "Authorization: Basic $AUTH" \
            -H "Accept: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY?fields=description")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "ERROR: Jira description fetch returned HTTP $HTTP_CODE"
            cat /tmp/jira_desc.json
            exit 1
          fi

          DESC=$(cat /tmp/jira_desc.json \
            | jq -r '
                def extract_text: . as $node |
                  if type == "array" then map(extract_text) | add // ""
                  elif type == "object" then
                    if .type == "text" then .text // ""
                    else (.content // [] | map(extract_text) | add // "")
                    end
                  else ""
                  end;
                .fields.description | extract_text')

          if [[ -z "$DESC" || "$DESC" == "null" ]]; then
            echo "SCORE=0"           >> "$GITHUB_OUTPUT"
            echo "VERDICT=REWRITE"   >> "$GITHUB_OUTPUT"
            echo "FEEDBACK=No description or acceptance criteria found on this Jira story. Please add ACs before moving to Ready for QA." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build OpenAI request
          PROMPT=$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n\n%s\n%s\n' \
            'You are an expert QA engineer reviewing acceptance criteria (ACs) for test automation feasibility.' \
            'Score the following Jira story description. Extract each AC and score it 1-5 on:' \
            '- Specific (exact values/messages vs vague language)' \
            '- Verifiable (clear pass/fail a script can assert vs should work)' \
            '- Scoped (one behaviour vs compound)' \
            '- Data-independent (works with test data vs requires specific live data)' \
            'Overall score = average of all individual AC averages.' \
            'Verdict rules:' \
            '- 4.0-5.0: AUTOMATE (ready as-is)' \
            '- 3.0-3.9: IMPROVE (minor fixes needed, proceed with warnings)' \
            '- 1.0-2.9: REWRITE (too vague, pipeline should be blocked)' \
            'Return ONLY valid JSON: {"score":<1.0-5.0>,"verdict":"AUTOMATE|IMPROVE|REWRITE","summary":"<assessment>","issues":["<i1>"],"suggestions":["<s1>"]}' \
            'Story description:' \
            "$DESC")

          # Call OpenAI — capture HTTP code separately so we can diagnose failures
          HTTP_CODE=$(curl --noproxy '*' -s -o /tmp/openai_response.json -w "%{http_code}" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.openai.com/v1/chat/completions \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"temperature\": 0,
              \"messages\": [{\"role\": \"user\", \"content\": $(echo "$PROMPT" | jq -Rs .)}]
            }")

          echo "OpenAI HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "WARNING: OpenAI API returned HTTP $HTTP_CODE — proceeding with IMPROVE verdict"
            cat /tmp/openai_response.json
            echo "SCORE=N/A"   >> "$GITHUB_OUTPUT"
            echo "VERDICT=IMPROVE" >> "$GITHUB_OUTPUT"
            echo "SUMMARY=⚠️ AC review could not be completed — OpenAI API returned HTTP $HTTP_CODE. Please review ACs manually before proceeding. Pipeline continuing with IMPROVE verdict." >> "$GITHUB_OUTPUT"
            echo "ISSUES=• OpenAI API unavailable (HTTP $HTTP_CODE)" >> "$GITHUB_OUTPUT"
            echo "SUGGESTIONS=• Retry by moving story back to Ready for QA once API is available" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(cat /tmp/openai_response.json)

          # Validate response is parseable JSON
          if ! echo "$RESPONSE" | jq empty 2>/dev/null; then
            echo "WARNING: OpenAI returned non-JSON — proceeding with IMPROVE verdict"
            echo "$RESPONSE"
            echo "SCORE=N/A"   >> "$GITHUB_OUTPUT"
            echo "VERDICT=IMPROVE" >> "$GITHUB_OUTPUT"
            echo "SUMMARY=⚠️ AC review could not be completed — OpenAI returned an unreadable response. Please review ACs manually. Pipeline continuing with IMPROVE verdict." >> "$GITHUB_OUTPUT"
            echo "ISSUES=• OpenAI response was not valid JSON" >> "$GITHUB_OUTPUT"
            echo "SUGGESTIONS=• Retry by moving story back to Ready for QA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract and validate AI content field
          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [[ -z "$AI_CONTENT" ]]; then
            echo "WARNING: OpenAI response missing content field — proceeding with IMPROVE verdict"
            echo "$RESPONSE" | jq .
            echo "SCORE=N/A"   >> "$GITHUB_OUTPUT"
            echo "VERDICT=IMPROVE" >> "$GITHUB_OUTPUT"
            echo "SUMMARY=⚠️ AC review could not be completed — OpenAI returned an empty response. Please review ACs manually. Pipeline continuing with IMPROVE verdict." >> "$GITHUB_OUTPUT"
            echo "ISSUES=• OpenAI content field was empty" >> "$GITHUB_OUTPUT"
            echo "SUGGESTIONS=• Retry by moving story back to Ready for QA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip markdown code fences OpenAI sometimes wraps JSON in (```json ... ```)
          AI_CLEAN=$(echo "$AI_CONTENT" | sed 's/```json//g' | sed 's/```//g' | tr -d '\r' | sed '/^[[:space:]]*$/d')

          # Parse — fallback to safe defaults if still unparseable
          AI_JSON=$(echo "$AI_CLEAN" | jq . 2>/dev/null)
          if [[ -z "$AI_JSON" || "$AI_JSON" == "null" ]]; then
            echo "WARNING: Could not parse OpenAI content as JSON after stripping markdown. Raw content:"
            echo "$AI_CONTENT"
            AI_JSON='{"score":"3.0","verdict":"IMPROVE","summary":"AC review completed but response could not be parsed. Please review ACs manually.","issues":[],"suggestions":[]}'
          fi

          SCORE=$(echo "$AI_JSON"    | jq -r '.score    // "3.0"')
          VERDICT=$(echo "$AI_JSON"  | jq -r '.verdict  // "IMPROVE"')
          SUMMARY=$(echo "$AI_JSON"  | jq -r '.summary  // "Review completed."')
          ISSUES=$(echo "$AI_JSON"   | jq -r '.issues[]? // empty' | sed 's/^/• /' | tr '\n' '|')
          SUGGESTIONS=$(echo "$AI_JSON" | jq -r '.suggestions[]? // empty' | sed 's/^/• /' | tr '\n' '|')

          echo "SCORE=$SCORE"           >> "$GITHUB_OUTPUT"
          echo "VERDICT=$VERDICT"       >> "$GITHUB_OUTPUT"
          echo "SUMMARY=$SUMMARY"       >> "$GITHUB_OUTPUT"
          echo "ISSUES=$ISSUES"         >> "$GITHUB_OUTPUT"
          echo "SUGGESTIONS=$SUGGESTIONS" >> "$GITHUB_OUTPUT"

          echo "AC Review Score:   $SCORE"
          echo "AC Review Verdict: $VERDICT"

      - name: Post AC review comment to Jira
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          SCORE: ${{ steps.ac_review.outputs.SCORE }}
          VERDICT: ${{ steps.ac_review.outputs.VERDICT }}
          SUMMARY: ${{ steps.ac_review.outputs.SUMMARY }}
          ISSUES: ${{ steps.ac_review.outputs.ISSUES }}
          SUGGESTIONS: ${{ steps.ac_review.outputs.SUGGESTIONS }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)

          # Convert pipe-delimited text into a JSON array of ADF listItem nodes.
          # Returns '[]' when input is empty — avoids invalid empty bulletList.
          make_list_items() {
            echo "$1" | tr '|' '\n' | grep -v '^$' | \
              jq -Rc '{"type":"listItem","content":[{"type":"paragraph","content":[{"type":"text","text":.}]}]}' | \
              jq -sc '.'
          }

          ISSUE_ITEMS=$(make_list_items "$ISSUES")
          SUGGESTION_ITEMS=$(make_list_items "$SUGGESTIONS")

          # Build the full ADF document body using jq — handles all special-char escaping.
          # Bullet-list sections are omitted entirely when they have no items.
          BODY=$(jq -n \
            --arg score "$SCORE" \
            --arg verdict "$VERDICT" \
            --arg summary "$SUMMARY" \
            --argjson issue_items "$ISSUE_ITEMS" \
            --argjson suggestion_items "$SUGGESTION_ITEMS" \
            '
            def section(heading; items):
              if (items | length) > 0 then
                [
                  {"type":"heading","attrs":{"level":4},"content":[{"type":"text","text":heading}]},
                  {"type":"bulletList","content":items}
                ]
              else [] end;

            {
              "body": {
                "version": 1, "type": "doc",
                "content": (
                  [
                    {"type":"heading","attrs":{"level":3},"content":[{"type":"text","text":"AC Automation Feasibility Review"}]},
                    {"type":"paragraph","content":[{"type":"text","text":("Score: " + $score + " / 5.0  |  Verdict: " + $verdict),"marks":[{"type":"strong"}]}]},
                    {"type":"paragraph","content":[{"type":"text","text":$summary}]}
                  ]
                  + section("Issues Found"; $issue_items)
                  + section("Suggestions"; $suggestion_items)
                )
              }
            }
            ')

          curl --noproxy '*' -sf -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/comment" \
            -d "$BODY"
          echo "AC review comment posted to $ISSUE_KEY"

      - name: Block pipeline and move to In Progress if ACs need rewrite
        if: steps.ac_review.outputs.VERDICT == 'REWRITE'
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          # Transition back to In Progress (ID 21)
          curl --noproxy '*' -sf -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/transitions" \
            -d '{"transition": {"id": "21"}}'
          echo "Story moved back to In Progress — ACs require rewrite before automation can proceed."
          exit 1

      - name: Create feature branch
        id: branch
        run: |
          BRANCH="auto/test-$(echo "$ISSUE_KEY" | tr '[:upper:]' '[:lower:]')"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists - checking out"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            echo "Branch $BRANCH pushed to remote"
          fi

          echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH"

      - name: Create GitHub Issue for Copilot
        id: gh_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          JIRA_SUMMARY="${{ steps.jira.outputs.ISSUE_SUMMARY }}"
          FRAMEWORK="${{ steps.jira.outputs.FRAMEWORK }}"
          gh label create "automated-qa" --color "#0075ca" --description "Automated QA test generation" 2>/dev/null || true
          gh label create "framework:playwright" --color "#45ba4b" --description "Playwright tests" 2>/dev/null || true
          gh label create "framework:cypress" --color "#04c38e" --description "Cypress tests" 2>/dev/null || true

          if [[ "$FRAMEWORK" == "cypress" ]]; then
            printf '## Automation Task\n\n**Jira Story:** [%s](%s/browse/%s)\n**Branch:** `%s`\n**Framework:** Cypress\n\n## Agent Instructions\n\nGenerate Cypress TypeScript E2E tests for all acceptance criteria in the Jira story.\n\n### Conventions\n- Place files under `Cypress/cypress/e2e/` (one subfolder per story)\n- Config: `Cypress/cypress.config.ts`\n- Naming: `{app-prefix}-cy-{area}-{seq:02d}-{kebab-description}.cy.ts`\n- Selectors: prefer [data-cy], [data-testid], ARIA roles\n- One `it()` per acceptance criterion\n- Use `cy.session()` for login state caching\n- Use `cy.intercept()` for network stubbing/waiting\n\nCommit all test files to branch `%s`\n' \
              "$ISSUE_KEY" "$ATLASSIAN_BASE_URL" "$ISSUE_KEY" "$BRANCH" "$BRANCH" \
              > /tmp/issue_body.md
            FRAMEWORK_LABEL="framework:cypress"
          else
            printf '## Automation Task\n\n**Jira Story:** [%s](%s/browse/%s)\n**Branch:** `%s`\n**Framework:** Playwright\n\n## Agent Instructions\n\nGenerate Playwright TypeScript E2E tests for all acceptance criteria in the Jira story.\n\n### Conventions\n- Place files under `Playwright/OrangeHRM/tests/orangehrm-e2e/` (subfolders: auth/ pim/ leave/ session/)\n- Reuse storageState from `seed.spec.ts` (do NOT re-login)\n- Config: `Playwright/OrangeHRM/orangehrm.playwright.config.ts`\n- Selectors: prefer [data-test], ARIA roles, [name] attributes\n- One `test()` per acceptance criterion\n- Naming: `tc-{story-id}-{description}.spec.ts`\n- Credentials from env: ORANGEHRM_USERNAME / ORANGEHRM_PASSWORD\n- Use timestamp suffixes for dynamic test data\n- Add afterAll teardown when test data is created\n\nCommit all test files to branch `%s`\n' \
              "$ISSUE_KEY" "$ATLASSIAN_BASE_URL" "$ISSUE_KEY" "$BRANCH" "$BRANCH" \
              > /tmp/issue_body.md
            FRAMEWORK_LABEL="framework:playwright"
          fi

          ISSUE_URL=$(gh issue create \
            --title "[$ISSUE_KEY] Automate: $JIRA_SUMMARY" \
            --label "automated-qa" \
            --label "$FRAMEWORK_LABEL" \
            --body-file /tmp/issue_body.md)
          echo "$ISSUE_URL"
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oP '(?<=/issues/)\d+')
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ISSUE_URL=$ISSUE_URL"       >> "$GITHUB_OUTPUT"

      - name: Assign Copilot to GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.gh_issue.outputs.ISSUE_NUMBER }} \
            --add-assignee "Copilot" 2>/dev/null || true

      - name: Transition Jira issue to In QA
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          curl --noproxy '*' -sf -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/transitions" \
            -d '{"transition": {"id": "41"}}'
          echo "Jira status -> In QA"

      - name: Comment on Jira issue
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.BRANCH }}
          GH_ISSUE_URL: ${{ steps.gh_issue.outputs.ISSUE_URL }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          curl --noproxy '*' -sf -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/comment" \
            -d "{\"body\":{\"version\":1,\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Automation pipeline triggered. Copilot is generating tests. Branch: $BRANCH | Issue: $GH_ISSUE_URL\"}]}]}}"
          echo "Jira comment posted"

      - name: Trigger Playwright tests on feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.BRANCH }}
        run: |
          # Explicitly dispatch playwright.yml via GitHub API — GITHUB_TOKEN push suppresses
          # push events so we must trigger downstream tests via workflow_dispatch API call instead.
          # Requires actions: write permission (set in job-level permissions block above).
          HTTP_CODE=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/playwright.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}")
          if [[ "$HTTP_CODE" != "204" ]]; then
            echo "ERROR: workflow dispatch returned HTTP $HTTP_CODE"
            cat /tmp/dispatch_response.json
            exit 1
          fi
          echo "Playwright workflow triggered on $BRANCH (HTTP $HTTP_CODE)"
