name: Playwright Tests
on:
  push:
    branches: [ main, master, dev, auto/** ]
    paths:
      - 'qa-framework/frameworks/playwright/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'qa-framework/frameworks/playwright/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to test against'
        required: false
        default: 'dev'
env:
  # Governance defaults — override by setting these as GitHub repository variables (Settings → Variables → Actions)
  BASE_URL: 'https://www.saucedemo.com'
  REQUIRE_BASE_URL: 'true'
  EXPECTED_HOST: ''
  STRICT_MODE: 'true'
  ALLOW_PARTIAL_AC: 'false'
  FLAKY_FAIL_THRESHOLD: '0'
  ALLOW_FLAKY: 'false'

jobs:
  # ===========================================================================
  # GATE 2 — Human approval of agent-generated tests
  # ---------------------------------------------------------------------------
  # Pauses before executing tests that the Copilot coding agent wrote, so a human
  # can read the diff on auto/test-* first.
  #
  # Scoped to auto/test-* branches ONLY — pushes to dev/main are ordinary human
  # commits and run unguarded, exactly as before.
  #
  # Setup: Settings → Environments → New environment → `test-approval`
  #        → Required reviewers → add the QA lead(s) → Save.
  # ===========================================================================
  approve_tests:
    name: "🚦 GATE 2 — Approve generated tests"
    if: startsWith(inputs.ref || github.head_ref || github.ref_name, 'auto/test-')
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: test-approval
    steps:
      - name: Record approval
        run: |
          BRANCH="${{ inputs.ref || github.head_ref || github.ref_name }}"
          echo "::notice::GATE 2 approved by ${{ github.actor }} for ${BRANCH}"
          {
            echo "## ✅ GATE 2 approved — generated tests cleared to run"
            echo ""
            echo "Approved by: @${{ github.actor }}"
            echo "Branch: \`${BRANCH}\`"
            echo ""
            echo "[Review the generated tests](https://github.com/${{ github.repository }}/tree/${BRANCH}/qa-framework/frameworks/playwright/tests)"
          } >> "$GITHUB_STEP_SUMMARY"

  test-saucedemo:
    name: SauceDemo E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [approve_tests]
    # approve_tests is SKIPPED on dev/main pushes (not an auto/test-* branch).
    # A skipped dependency would normally skip this job too, so accept both
    # "success" and "skipped" — and block only on an explicit reviewer rejection.
    if: ${{ !cancelled() && needs.approve_tests.result != 'failure' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: "Pre-flight: TypeScript compilation check"
      run: |
        echo "::group::TypeScript compilation"
        npx tsc --noEmit -p qa-framework/frameworks/playwright/tsconfig.json
        echo "::endgroup::"
        echo "::notice::TypeScript compilation: OK"

    - name: "Pre-flight: Environment validation"
      run: node scripts/preflight-env.js --framework playwright

    - name: "Pre-flight: AC coverage check"
      run: node scripts/validate-ac-coverage.js

    - name: "Pre-flight: Playwright test compliance check"
      run: node scripts/validate-playwright-tests.js

    - name: "Pre-flight: Test quality gate (assertions + observability)"
      run: node scripts/validate-test-quality.js

    - name: "Pre-flight: Playwright data validation"
      run: node scripts/validate-playwright-data.js

    - name: "DEBUG: Environment info"
      run: |
        echo "::group::Environment"
        echo "Node: $(node -v)"
        echo "npm:  $(npm -v)"
        npx playwright --version
        echo "OS:   ${{ runner.os }}"
        echo "Ref:  ${{ inputs.ref || github.ref }}"
        echo "SHA:  ${{ github.sha }}"
        echo "Run:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "::endgroup::"

    - name: "DEBUG: List test specs"
      run: |
        echo "::group::Playwright specs found"
        find qa-framework/frameworks/playwright/tests -name "*.spec.ts" ! -name "*.notimplemented.spec.ts" 2>/dev/null | sort || echo "(none)"
        echo "---"
        echo "Ignored stubs:"
        find qa-framework/frameworks/playwright/tests -name "*.notimplemented.spec.ts" 2>/dev/null | sort || echo "(none)"
        echo "::endgroup::"

    - name: Run SauceDemo Playwright tests
      run: npx playwright test --config=qa-framework/frameworks/playwright/playwright.config.ts

    - name: "DEBUG: Test results summary"
      if: always()
      run: |
        echo "::group::Playwright test results"
        RESULTS_FILE="qa-framework/frameworks/playwright/test-results/results.json"
        if [[ -f "$RESULTS_FILE" ]]; then
          echo "results.json found ($(wc -c < "$RESULTS_FILE") bytes)"
          cat "$RESULTS_FILE" | jq '{passed: .stats.expected, failed: .stats.unexpected, skipped: .stats.skipped, duration: .stats.duration}' 2>/dev/null || \
            echo "Partial JSON:" && head -c 2000 "$RESULTS_FILE"
        else
          echo "::warning::results.json NOT found at $RESULTS_FILE"
          echo "test-results dir contents:"
          ls -la qa-framework/frameworks/playwright/test-results/ 2>/dev/null || echo "(directory missing)"
        fi
        echo "::endgroup::"

    - name: "Post-run: Flaky test governance"
      if: always()
      run: |
        RESULTS_FILE="qa-framework/frameworks/playwright/test-results/results.json"
        if [[ -f "$RESULTS_FILE" ]]; then
          node scripts/check-flaky-threshold.js \
            --results-json "$RESULTS_FILE" \
            --framework playwright
        else
          echo "::error::Flaky check skipped — results.json not found. Tests did not produce output."
          exit 1
        fi


    - name: "Post-run: AC execution validation"
      if: always()
      run: |
        RESULTS_FILE="qa-framework/frameworks/playwright/test-results/results.json"
        if [[ -f "$RESULTS_FILE" ]]; then
          node scripts/validate-ac-execution.js \
            --results-json "$RESULTS_FILE" \
            --framework playwright
        else
          echo "::error::AC execution validation skipped — results.json not found."
          exit 1
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: saucedemo-playwright-report
        path: qa-framework/frameworks/playwright/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: saucedemo-test-results-json
        path: qa-framework/frameworks/playwright/test-results/results.json
        retention-days: 30

    - name: Generate test execution report
      if: always()
      run: |
        BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF}}"
        if [[ "$BRANCH" =~ auto/test-(.+) ]]; then
          SLUG="${BASH_REMATCH[1]}"
          ISSUE_KEY=$(echo "$SLUG" | tr '[:lower:]' '[:upper:]' | sed 's/-\([0-9]\)/-\1/')
        else
          ISSUE_KEY="PIPELINE-${GITHUB_RUN_NUMBER}"
        fi
        RESULTS_FILE="qa-framework/frameworks/playwright/test-results/results.json"
        if [[ ! -f "$RESULTS_FILE" ]]; then
          echo "::warning::Playwright results.json not found — skipping report generation"
          exit 0
        fi
        node scripts/generate-report.js \
          --framework playwright \
          --results-json "$RESULTS_FILE" \
          --story-key   "$ISSUE_KEY" \
          --branch      "$BRANCH" \
          --commit-sha  "$GITHUB_SHA" \
          --run-url     "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        echo "::group::Report preview"
        head -30 "qa-framework/reports/${ISSUE_KEY}-test-report.md" 2>/dev/null || echo "(report not found)"
        echo "::endgroup::"

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        # Name ends with -test-report-md so post-results-to-jira.yml picks it up
        name: saucedemo-playwright-test-report-md
        path: qa-framework/reports/
        retention-days: 30

    - name: Trigger post-results pipeline
      # Explicitly dispatch post-results-to-jira.yml when running on auto/test-* branches.
      # Required because workflow_run does NOT fire for workflow_dispatch-triggered runs.
      # Branch comes from inputs.ref (feature branch) because this workflow is dispatched
      # with ref=dev (to get latest workflow file) but inputs.ref=$BRANCH (feature branch code).
      if: always() && startsWith(inputs.ref || github.ref_name, 'auto/test-')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        FEATURE_BRANCH="${{ inputs.ref || github.ref_name }}"
        gh workflow run post-results-to-jira.yml \
          --ref dev \
          --field run_id="${{ github.run_id }}" \
          --field branch="$FEATURE_BRANCH" \
          --field conclusion="${{ job.status }}" \
          --field head_sha="${{ github.sha }}" \
          --field workflow_name="Playwright Tests"
        echo "::notice::post-results-to-jira.yml dispatched (run_id=${{ github.run_id }} branch=$FEATURE_BRANCH conclusion=${{ job.status }})"
