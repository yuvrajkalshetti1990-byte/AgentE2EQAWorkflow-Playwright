name: Post Test Results to Jira

# Triggers after Playwright Tests OR Cypress Tests workflow completes on auto/test-* branches.
# - Posts a comment on the Jira issue with pass/fail + test counts
# - Transitions Jira to "Done" when all tests pass
# - Opens a PR from auto/test-* -> dev when all tests pass
#
# DUAL TRIGGER STRATEGY:
# - workflow_run   → fires when CI was triggered by a push event (e.g. Copilot commits tests)
# - workflow_dispatch → fired explicitly at the END of cypress.yml / playwright.yml when
#   those workflows were started via workflow_dispatch (our pipeline dispatch step).
#   GitHub does NOT fire workflow_run for workflow_dispatch-triggered workflows.

on:
  workflow_run:
    workflows: ["Playwright Tests", "Cypress Tests"]
    types: [completed]
  # Direct call from end of cypress.yml / playwright.yml (workflow_dispatch path)
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the CI workflow that completed'
        required: true
      branch:
        description: 'Feature branch name (e.g. auto/test-scrum-18)'
        required: true
      conclusion:
        description: 'Job conclusion: success | failure | cancelled'
        required: true
      head_sha:
        description: 'HEAD SHA of the feature branch'
        required: true
      workflow_name:
        description: 'Name of the triggering test workflow'
        required: false
        default: 'CI Tests'

env:
  ATLASSIAN_CLOUD_ID: ${{ vars.ATLASSIAN_CLOUD_ID }}
  ATLASSIAN_BASE_URL: ${{ vars.ATLASSIAN_BASE_URL }}
  ATLASSIAN_EMAIL:    ${{ vars.ATLASSIAN_EMAIL }}
  # Jira transition ID for "Done" (ID 52, confirmed via API)
  JIRA_DONE_TRANSITION_ID: "52"

jobs:
  report-to-jira:
    name: Report results to Jira
    runs-on: ubuntu-latest
    # Allow both trigger paths:
    # - workflow_dispatch: fired directly by cypress.yml/playwright.yml (pipeline dispatch path)
    # - workflow_run: fired by push-triggered CI runs (Copilot commit push path)
    if: >
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.branch, 'auto/test-')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped' && startsWith(github.event.workflow_run.head_branch, 'auto/test-'))

    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Normalize trigger context
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_id=${{ inputs.run_id }}"         >> "$GITHUB_OUTPUT"
            echo "branch=${{ inputs.branch }}"         >> "$GITHUB_OUTPUT"
            echo "conclusion=${{ inputs.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ inputs.head_sha }}"     >> "$GITHUB_OUTPUT"
            echo "workflow_name=${{ inputs.workflow_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}"             >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}"    >> "$GITHUB_OUTPUT"
            echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}"     >> "$GITHUB_OUTPUT"
            echo "workflow_name=${{ github.event.workflow_run.name }}"    >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_sha }}

      - name: Extract Jira issue key from branch name
        id: extract
        run: |
          BRANCH="${{ steps.ctx.outputs.branch }}"
          # Branch format: auto/test-scrum-8  ->  SCRUM-8
          ISSUE_KEY=$(echo "$BRANCH" | sed 's|auto/test-||' | tr '[:lower:]' '[:upper:]' | sed 's/-\([0-9]\)/-\1/')
          echo "ISSUE_KEY=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$BRANCH"       >> "$GITHUB_OUTPUT"

          echo "::group::Trigger Context"
          echo "Triggering workflow: ${{ steps.ctx.outputs.workflow_name }}"
          echo "Conclusion:          ${{ steps.ctx.outputs.conclusion }}"
          echo "Run ID:              ${{ steps.ctx.outputs.run_id }}"
          echo "Branch:              $BRANCH"
          echo "Extracted key:       $ISSUE_KEY"
          echo "Head SHA:            ${{ steps.ctx.outputs.head_sha }}"
          echo "Run URL:             https://github.com/${{ github.repository }}/actions/runs/${{ steps.ctx.outputs.run_id }}"
          echo "::endgroup::"
          echo "::notice::Triggered by: ${{ steps.ctx.outputs.workflow_name }} (conclusion=${{ steps.ctx.outputs.conclusion }}) branch=$BRANCH key=$ISSUE_KEY"

      - name: Download test results JSON (Playwright + Cypress)
        id: download
        env:
          INPUT_RUN_ID: ${{ steps.ctx.outputs.run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            const runId = parseInt(process.env.INPUT_RUN_ID);
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            console.log(`Total artifacts in run ${runId}: ${artifacts.data.artifacts.length}`);
            console.log('All artifacts:', artifacts.data.artifacts.map(a => `${a.name} (${a.size_in_bytes} bytes)`).join(', '));

            const fs = require('fs');
            const { execSync } = require('child_process');
            let totalPassed = 0, totalFailed = 0, totalSkipped = 0;
            let countsFound = false;
            let reportArtifactUrl = '';

            for (const artifact of artifacts.data.artifacts) {
              // Capture the URL for any *-test-report-md artifact so we can link it from Jira
              if (artifact.name.endsWith('-test-report-md') && !reportArtifactUrl) {
                reportArtifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
                console.log(`Found report artifact: ${artifact.name} → linking run at ${reportArtifactUrl}`);
              }
            }
            core.setOutput('report_run_url', reportArtifactUrl);

            for (const artifact of artifacts.data.artifacts) {
              // Match any artifact that ends with -test-results-json
              // Playwright produces: saucedemo-test-results-json  containing results.json
              // Cypress produces:    cypress-test-results-json    containing mochawesome.json
              if (!artifact.name.endsWith('-test-results-json')) continue;

              console.log(`Downloading artifact: ${artifact.name}`);
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });

              const tmpFile = `/tmp/${artifact.name}.zip`;
              const tmpDir  = `/tmp/${artifact.name}`;
              fs.writeFileSync(tmpFile, Buffer.from(download.data));
              execSync(`unzip -o "${tmpFile}" -d "${tmpDir}"`);
              console.log(`Unzipped to ${tmpDir}:`);
              execSync(`find "${tmpDir}" -type f`, { stdio: ['pipe', 'pipe', 'pipe'] })
                .toString().split('\n').filter(Boolean).forEach(f => console.log(`  ${f}`));

              // Try Playwright format first (results.json), then Cypress Mochawesome (mochawesome.json)
              const candidates = [
                `${tmpDir}/results.json`,
                `${tmpDir}/mochawesome.json`,
                `${tmpDir}/mochawesome/mochawesome.json`,
              ];

              for (const jsonPath of candidates) {
                if (!fs.existsSync(jsonPath)) continue;
                console.log(`Parsing results from: ${jsonPath}`);
                let results;
                try {
                  results = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                } catch (e) {
                  console.log(`  Could not parse ${jsonPath}: ${e.message}`);
                  continue;
                }

                // Playwright JSON:        stats.expected / unexpected / skipped
                // Cypress Mochawesome:    stats.passes   / failures   / pending
                const p = results.stats?.expected   ?? results.stats?.passes   ?? 0;
                const f = results.stats?.unexpected ?? results.stats?.failures ?? 0;
                const s = results.stats?.skipped    ?? results.stats?.pending  ?? 0;
                totalPassed  += p;
                totalFailed  += f;
                totalSkipped += s;
                countsFound = true;
                console.log(`  Counts from ${jsonPath}: passed=${p} failed=${f} skipped=${s}`);
                console.log(`  Cumulative: passed=${totalPassed} failed=${totalFailed} skipped=${totalSkipped}`);
                break; // only read the first matching file per artifact
              }
            }

            const total = totalPassed + totalFailed + totalSkipped;
            core.setOutput('passed',     String(totalPassed));
            core.setOutput('failed',     String(totalFailed));
            core.setOutput('skipped',    String(totalSkipped));
            core.setOutput('total',      String(total));
            // has_counts = true when we found and parsed a results file
            core.setOutput('has_counts', countsFound ? 'true' : 'false');
            if (!countsFound) {
              console.log('WARNING: No parseable results JSON found in any -test-results-json artifact.');
              console.log('Jira comment will still be posted; Done transition and PR rely on workflow conclusion.');
            }

      - name: Build result summary
        id: result
        run: |
          CONCLUSION="${{ steps.ctx.outputs.conclusion }}"
          RUN_ID="${{ steps.ctx.outputs.run_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
          SHA="${{ steps.ctx.outputs.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          PASSED="${{ steps.download.outputs.passed }}"
          FAILED="${{ steps.download.outputs.failed }}"
          SKIPPED="${{ steps.download.outputs.skipped }}"
          TOTAL="${{ steps.download.outputs.total }}"
          HAS_COUNTS="${{ steps.download.outputs.has_counts }}"
          WORKFLOW="${{ steps.ctx.outputs.workflow_name }}"

          if [[ "$CONCLUSION" == "success" ]]; then
            ICON="PASSED"
            RESULT_TEXT="All tests passed."
          elif [[ "$CONCLUSION" == "failure" ]]; then
            ICON="FAILED"
            RESULT_TEXT="One or more tests failed. Review the workflow run for details."
          else
            ICON="${CONCLUSION^^}"
            RESULT_TEXT="Workflow ended with status: $CONCLUSION"
          fi

          if [[ "$HAS_COUNTS" == "true" ]]; then
            COUNT_LINE="Results: ${PASSED} passed, ${FAILED} failed, ${SKIPPED} skipped (${TOTAL} total)"
          else
            # No JSON artifact found — report conclusion only (Cypress may not have produced JSON yet)
            COUNT_LINE="Results: workflow ${CONCLUSION} — no JSON artifact found (check CI logs for details)"
          fi

          echo "ICON=$ICON"               >> "$GITHUB_OUTPUT"
          echo "RESULT_TEXT=$RESULT_TEXT" >> "$GITHUB_OUTPUT"
          echo "COUNT_LINE=$COUNT_LINE"   >> "$GITHUB_OUTPUT"
          echo "RUN_URL=$RUN_URL"         >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA"     >> "$GITHUB_OUTPUT"
          echo "WORKFLOW=$WORKFLOW"       >> "$GITHUB_OUTPUT"

      - name: Verify Jira issue exists
        id: verify_jira
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          ISSUE_KEY: ${{ steps.extract.outputs.ISSUE_KEY }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          HTTP_STATUS=$(curl --noproxy '*' -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Basic $AUTH" \
            -H "Accept: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY")
          echo "JIRA_EXISTS=$([ "$HTTP_STATUS" == "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Jira $ISSUE_KEY HTTP status: $HTTP_STATUS"

      - name: Post comment on Jira issue
        if: steps.verify_jira.outputs.JIRA_EXISTS == 'true'
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          ISSUE_KEY: ${{ steps.extract.outputs.ISSUE_KEY }}
          ICON: ${{ steps.result.outputs.ICON }}
          RESULT_TEXT: ${{ steps.result.outputs.RESULT_TEXT }}
          COUNT_LINE: ${{ steps.result.outputs.COUNT_LINE }}
          RUN_URL: ${{ steps.result.outputs.RUN_URL }}
          SHORT_SHA: ${{ steps.result.outputs.SHORT_SHA }}
          BRANCH: ${{ steps.extract.outputs.BRANCH }}
          WORKFLOW: ${{ steps.result.outputs.WORKFLOW }}
          REPORT_RUN_URL: ${{ steps.download.outputs.report_run_url }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)

          # Build the report link list item — only include if a report artifact was found
          if [[ -n "$REPORT_RUN_URL" ]]; then
            REPORT_ITEM="{ \"type\": \"listItem\", \"content\": [{ \"type\": \"paragraph\", \"content\": [{ \"type\": \"text\", \"text\": \"Test Execution Report: $REPORT_RUN_URL (download *-test-report-md artifact)\" }] }] },"
          else
            REPORT_ITEM=""
          fi

          curl --noproxy '*' -sf -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/comment" \
            -d "{
              \"body\": {
                \"version\": 1,
                \"type\": \"doc\",
                \"content\": [
                  {
                    \"type\": \"paragraph\",
                    \"content\": [
                      { \"type\": \"text\", \"text\": \"CI Test Result: $ICON  |  $WORKFLOW\", \"marks\": [{\"type\": \"strong\"}] }
                    ]
                  },
                  {
                    \"type\": \"paragraph\",
                    \"content\": [
                      { \"type\": \"text\", \"text\": \"$RESULT_TEXT\" }
                    ]
                  },
                  {
                    \"type\": \"paragraph\",
                    \"content\": [
                      { \"type\": \"text\", \"text\": \"$COUNT_LINE\" }
                    ]
                  },
                  {
                    \"type\": \"bulletList\",
                    \"content\": [
                      { \"type\": \"listItem\", \"content\": [{ \"type\": \"paragraph\", \"content\": [{ \"type\": \"text\", \"text\": \"Branch: $BRANCH\" }] }] },
                      { \"type\": \"listItem\", \"content\": [{ \"type\": \"paragraph\", \"content\": [{ \"type\": \"text\", \"text\": \"Commit: $SHORT_SHA\" }] }] },
                      { \"type\": \"listItem\", \"content\": [{ \"type\": \"paragraph\", \"content\": [{ \"type\": \"text\", \"text\": \"CI Run: $RUN_URL\" }] }] },
                      $REPORT_ITEM
                      { \"type\": \"listItem\", \"content\": [{ \"type\": \"paragraph\", \"content\": [{ \"type\": \"text\", \"text\": \"Full report: download *-test-report-md artifact from the CI run above\" }] }] }
                    ]
                  }
                ]
              }
            }"
          echo "Jira comment posted for $ISSUE_KEY: $ICON"

      - name: "DEBUG: Decision matrix"
        if: always()
        run: |
          echo "::group::Post-Results Decision Matrix"
          echo "Jira exists:       ${{ steps.verify_jira.outputs.JIRA_EXISTS }}"
          echo "CI conclusion:     ${{ github.event.workflow_run.conclusion }}"
          echo "Passed:            ${{ steps.download.outputs.passed }}"
          echo "Failed:            ${{ steps.download.outputs.failed }}"
          echo "Skipped:           ${{ steps.download.outputs.skipped }}"
          echo "Total:             ${{ steps.download.outputs.total }}"
          echo "has_counts:        ${{ steps.download.outputs.has_counts }}"
          echo "---"
          echo "Will post comment: ${{ steps.verify_jira.outputs.JIRA_EXISTS == 'true' }}"
          echo "Will mark Done:    CI=success AND failed=0 AND has_counts=true required"
          echo "Will open PR:      CI=success AND failed=0 AND has_counts=true required"
          echo "::endgroup::"

      - name: Transition Jira to Done (on success)
        # Requires BOTH: CI success AND a parsed test artifact confirming zero failures.
        # has_counts must be 'true' — Jira will NOT be marked Done if results artifact is missing.
        if: >
          steps.verify_jira.outputs.JIRA_EXISTS == 'true' &&
          steps.ctx.outputs.conclusion == 'success' &&
          steps.download.outputs.failed == '0' &&
          steps.download.outputs.has_counts == 'true'
        env:
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          ISSUE_KEY: ${{ steps.extract.outputs.ISSUE_KEY }}
        run: |
          unset HTTPS_PROXY HTTP_PROXY https_proxy http_proxy
          AUTH=$(echo -n "$ATLASSIAN_EMAIL:$ATLASSIAN_TOKEN" | base64 -w 0)
          HTTP=$(curl --noproxy '*' -s -o /tmp/jira_done.json -w "%{http_code}" -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            "https://api.atlassian.com/ex/jira/$ATLASSIAN_CLOUD_ID/rest/api/3/issue/$ISSUE_KEY/transitions" \
            -d "{\"transition\": {\"id\": \"$JIRA_DONE_TRANSITION_ID\"}}")

          echo "::group::Jira Done Transition (HTTP $HTTP)"
          cat /tmp/jira_done.json 2>/dev/null || echo "(empty body — 204 expected)"
          echo "::endgroup::"

          if [[ "$HTTP" == "204" ]]; then
            echo "::notice::Jira ${ISSUE_KEY} → Done (HTTP 204)"
            echo "Jira $ISSUE_KEY transitioned to Done"
          elif [[ "$HTTP" == "400" || "$HTTP" == "409" ]]; then
            echo "::notice::Jira ${ISSUE_KEY} already in target state (HTTP $HTTP) — skipping transition"
            echo "Jira $ISSUE_KEY already in Done or transition not applicable (HTTP $HTTP)"
          else
            echo "::error::Jira Done transition failed — HTTP $HTTP. Check JIRA_DONE_TRANSITION_ID ('$JIRA_DONE_TRANSITION_ID') or Atlassian API permissions."
            cat /tmp/jira_done.json 2>/dev/null || true
            exit 1
          fi

      - name: Open PR into dev (on success)
        # Requires BOTH: CI success AND a parsed test artifact confirming zero failures.
        # has_counts must be 'true' — PR will NOT be created if results artifact is missing.
        if: >
          steps.ctx.outputs.conclusion == 'success' &&
          steps.download.outputs.failed == '0' &&
          steps.download.outputs.has_counts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.extract.outputs.BRANCH }}
          ISSUE_KEY: ${{ steps.extract.outputs.ISSUE_KEY }}
        run: |
          # Check if a PR for this branch already exists (handles race condition
          # when both Cypress and Playwright post-results runs fire concurrently)
          EXISTING=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING" ]]; then
            echo "::notice::PR #$EXISTING already exists for $BRANCH -> dev, skipping"
            exit 0
          fi

          printf '## Automated test PR\n\nThis PR was created automatically after all CI tests passed on branch `%s`.\n\n**Jira story:** [%s](%s/browse/%s)\n\n### Checklist\n- [x] All CI jobs passed\n- [x] Jira transitioned to Done\n- [ ] Peer review\n- [ ] Merge to dev\n' \
            "$BRANCH" "$ISSUE_KEY" "$ATLASSIAN_BASE_URL" "$ISSUE_KEY" > /tmp/pr_body.md

          # Use || to gracefully handle concurrent creation (race condition between
          # Cypress and Playwright post-results runs firing at the same time)
          if gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "[$ISSUE_KEY] Automated tests - ready to merge" \
            --body-file /tmp/pr_body.md \
            --label "automated-qa" 2>/tmp/pr_create_err; then
            echo "::notice::PR created: ${BRANCH} → dev"
            echo "PR created: $BRANCH -> dev"
          else
            # Either PR was created by concurrent run, or a real error occurred
            CONCURRENT=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [[ -n "$CONCURRENT" ]]; then
              echo "::notice::PR #$CONCURRENT was created by a concurrent run — skipping"
            else
              echo "::error::Failed to create PR: $(cat /tmp/pr_create_err)"
              exit 1
            fi
          fi

