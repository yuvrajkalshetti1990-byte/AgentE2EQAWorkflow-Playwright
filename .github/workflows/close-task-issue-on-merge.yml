name: Close Task Issue on PR Merge

# Fires when any PR targeting dev is merged.
# Scoped to auto/test-* branches — ignores all other PRs.
# Closes the GitHub automation-task issue that was created by jira-ready-for-qa.yml
# for the same Jira story (identified by issue key in the branch name).
#
# Uses pull_request_target (not pull_request) so that GitHub resolves the workflow
# file from the BASE branch (dev) rather than the HEAD branch (auto/test-*).
# pull_request runs workflows from the HEAD branch — since auto/test-* branches
# never contain this file, the workflow would silently never fire.
#
# This is intentionally a standalone workflow so no existing pipeline logic is changed.

on:
  pull_request_target:
    types: [closed]
    branches: [dev]

jobs:
  close-task-issue:
    name: Close automation task issue
    # Only run when the PR was actually merged (not just closed/abandoned)
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'auto/test-')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Extract Jira issue key from branch name
        id: extract
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          # Branch format: auto/test-scrum-18  →  SCRUM-18
          ISSUE_KEY=$(echo "$BRANCH" | sed 's|auto/test-||' | tr '[:lower:]' '[:upper:]')
          echo "ISSUE_KEY=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "::notice::Branch=$BRANCH  IssueKey=$ISSUE_KEY"

      - name: Find and close the open automation task GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_KEY: ${{ steps.extract.outputs.ISSUE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Use REST API directly to find the open automation task issue.
          # gh issue list --search with --label combined produces silent empty results
          # due to a known gh CLI bug. The REST API is reliable.
          curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=automated-qa&per_page=100" \
            > /tmp/open_issues.json

          TASK_ISSUE=$(jq -r --arg key "$ISSUE_KEY" \
            '[.[] | select(.pull_request == null) | select(.title | test($key))] | first | .number // empty' \
            /tmp/open_issues.json 2>/dev/null || echo "")

          if [[ -z "$TASK_ISSUE" ]]; then
            echo "No open automation task issue found for $ISSUE_KEY — already closed or was never created."
            exit 0
          fi

          echo "Found issue #$TASK_ISSUE for $ISSUE_KEY — closing after PR #$PR_NUMBER merged."

          CLOSE_HTTP=$(curl -s -o /tmp/close_resp.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${TASK_ISSUE}" \
            -d '{"state":"closed","state_reason":"completed"}')

          if [[ "$CLOSE_HTTP" == "200" ]]; then
            echo "::notice::Closed GitHub issue #${TASK_ISSUE} after PR #${PR_NUMBER} merged (${ISSUE_KEY})"
          else
            echo "::error::Failed to close issue #${TASK_ISSUE} — HTTP ${CLOSE_HTTP}"
            cat /tmp/close_resp.json || true
            exit 1
          fi
