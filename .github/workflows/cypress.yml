name: Cypress Tests
on:
  push:
    branches: [ main, master, dev, auto/** ]
    paths:
      - 'qa-framework/frameworks/cypress/**'
      - '.github/workflows/cypress.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'qa-framework/frameworks/cypress/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to test against'
        required: false
        default: 'dev'

jobs:
  test-cypress:
    name: Cypress E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Cypress binary
      run: npx cypress install

    - name: "Pre-flight: TypeScript compilation check"
      run: |
        echo "::group::TypeScript compilation"
        npx tsc --noEmit -p qa-framework/frameworks/cypress/tsconfig.json
        echo "::endgroup::"
        echo "::notice::TypeScript compilation: OK"

    - name: "DEBUG: Environment info"
      run: |
        echo "::group::Environment"
        echo "Node: $(node -v)"
        echo "npm:  $(npm -v)"
        npx cypress version
        echo "OS:   ${{ runner.os }}"
        echo "Ref:  ${{ inputs.ref || github.ref }}"
        echo "SHA:  ${{ github.sha }}"
        echo "Run:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "::endgroup::"

    - name: Count runnable specs
      id: count_specs
      run: |
        # Exclude .notimplemented stubs — they are skipped intentionally
        SPEC_COUNT=$(find qa-framework/frameworks/cypress/tests -name "*.cy.ts" ! -name "*.notimplemented.cy.ts" 2>/dev/null | wc -l | tr -d ' ')
        echo "SPEC_COUNT=$SPEC_COUNT" >> "$GITHUB_OUTPUT"

        echo "::group::Cypress specs found ($SPEC_COUNT runnable)"
        find qa-framework/frameworks/cypress/tests -name "*.cy.ts" ! -name "*.notimplemented.cy.ts" 2>/dev/null | sort || echo "(none)"
        echo "---"
        echo "Ignored stubs:"
        find qa-framework/frameworks/cypress/tests -name "*.notimplemented.cy.ts" 2>/dev/null | sort || echo "(none)"
        echo "::endgroup::"
        echo "Runnable Cypress specs found: $SPEC_COUNT"

    - name: "Pre-flight: validate env vars and fixtures"
      run: |
        echo "::group::Env Validation"
        node -e "
          const fs = require('fs');
          const required = ['username', 'password', 'REQRES_API_KEY'];
          const envPath = 'qa-framework/frameworks/cypress/cypress.env.json';
          if (fs.existsSync(envPath)) {
            const env = JSON.parse(fs.readFileSync(envPath, 'utf8'));
            required.forEach(k => {
              if (env[k]) {
                console.log('  OK:   ' + k + ' is set');
              } else {
                console.log('  WARN: ' + k + ' missing in cypress.env.json (cypress.config.ts default will apply)');
              }
            });
          } else {
            console.log('::warning::No qa-framework/frameworks/cypress/cypress.env.json found — all env vars will use built-in defaults');
          }
          const fixtureDir = 'qa-framework/frameworks/cypress/fixtures';
          const required_fixtures = ['users.json', 'test.txt', 'checkout-user.json'];
          if (fs.existsSync(fixtureDir)) {
            required_fixtures.forEach(f => {
              const exists = fs.existsSync(fixtureDir + '/' + f);
              console.log('  FIXTURE ' + (exists ? 'OK:   ' : 'WARN: ') + f + (exists ? ' exists' : ' missing (will be auto-created by cypress.config.ts)'));
            });
          } else {
            console.log('  WARN: fixtures directory not found — will be created at runtime');
          }
        "
        echo "::endgroup::"

    - name: "Resilience lint: no raw cy.visit() or cy.request()"
      run: node scripts/lint-resilience.js

    - name: "Fixture validation: all cy.fixture() calls must have @requiredFixtures"
      run: node scripts/validate-fixtures.js

    - name: "Pre-flight: Cypress test compliance check"
      run: node scripts/validate-cypress-tests.js

    - name: "Pre-flight: Test quality gate (assertions + observability + cy.log)"
      run: node scripts/validate-test-quality.js

    - name: Run Cypress tests
      if: steps.count_specs.outputs.SPEC_COUNT != '0'
      run: |
        mkdir -p qa-framework/frameworks/cypress/reports
        npx cypress run --config-file qa-framework/frameworks/cypress/cypress.config.ts

    - name: "DEBUG: Cypress results"
      if: always() && steps.count_specs.outputs.SPEC_COUNT != '0'
      run: |
        echo "::group::Cypress reports directory"
        ls -la qa-framework/frameworks/cypress/reports/ 2>/dev/null || echo "(reports dir missing)"
        echo "::endgroup::"
        echo "::group::Mochawesome JSON summary"
        MOCH_FILE=""
        if [[ -f "qa-framework/frameworks/cypress/reports/results.json" ]]; then
          MOCH_FILE="qa-framework/frameworks/cypress/reports/results.json"
        elif [[ -f "qa-framework/frameworks/cypress/reports/mochawesome.json" ]]; then
          MOCH_FILE="qa-framework/frameworks/cypress/reports/mochawesome.json"
        elif [[ -f "qa-framework/frameworks/cypress/reports/mochawesome/mochawesome.json" ]]; then
          MOCH_FILE="qa-framework/frameworks/cypress/reports/mochawesome/mochawesome.json"
        fi
        if [[ -n "$MOCH_FILE" ]]; then
          echo "File: $MOCH_FILE ($(wc -c < "$MOCH_FILE") bytes)"
          cat "$MOCH_FILE" | jq '{passes: .stats.passes, failures: .stats.failures, pending: .stats.pending, duration: .stats.duration}' 2>/dev/null || \
            echo "Partial JSON:" && head -c 2000 "$MOCH_FILE"
        else
          echo "::warning::No mochawesome.json found — check reporter config"
        fi
        echo "::endgroup::"

    - name: Warn — no spec files found
      if: steps.count_specs.outputs.SPEC_COUNT == '0'
      run: |
        echo "::error::No runnable Cypress specs found — Copilot must generate tests before this workflow can pass."
        echo "No Cypress specs found — failing pipeline"
        exit 1

    - name: Upload Cypress videos
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.count_specs.outputs.SPEC_COUNT != '0' }}
      with:
        name: cypress-videos
        path: qa-framework/frameworks/cypress/videos/
        retention-days: 30

    - name: Upload Cypress screenshots
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.count_specs.outputs.SPEC_COUNT != '0' }}
      with:
        name: cypress-screenshots
        path: qa-framework/frameworks/cypress/screenshots/
        retention-days: 30

    - name: Upload Cypress results JSON
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.count_specs.outputs.SPEC_COUNT != '0' }}
      with:
        # Name ends with -test-results-json so post-results-to-jira.yml picks it up
        name: cypress-test-results-json
        path: qa-framework/frameworks/cypress/reports/
        retention-days: 30

    - name: Generate test execution report
      if: always() && steps.count_specs.outputs.SPEC_COUNT != '0'
      run: |
        BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF}}"
        if [[ "$BRANCH" =~ auto/test-(.+) ]]; then
          SLUG="${BASH_REMATCH[1]}"
          ISSUE_KEY=$(echo "$SLUG" | tr '[:lower:]' '[:upper:]' | sed 's/-\([0-9]\)/-\1/')
        else
          ISSUE_KEY="PIPELINE-${GITHUB_RUN_NUMBER}"
        fi
        RESULTS_FILE=""
        if [[ -f "qa-framework/frameworks/cypress/reports/results.json" ]]; then
          RESULTS_FILE="qa-framework/frameworks/cypress/reports/results.json"
        elif [[ -f "qa-framework/frameworks/cypress/reports/mochawesome.json" ]]; then
          RESULTS_FILE="qa-framework/frameworks/cypress/reports/mochawesome.json"
        fi
        if [[ -z "$RESULTS_FILE" ]]; then
          echo "::warning::No Cypress results JSON found — skipping report generation"
          exit 0
        fi
        node scripts/generate-report.js \
          --framework cypress \
          --results-json "$RESULTS_FILE" \
          --story-key   "$ISSUE_KEY" \
          --branch      "$BRANCH" \
          --commit-sha  "$GITHUB_SHA" \
          --run-url     "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        echo "::group::Report preview"
        head -30 "qa-framework/reports/${ISSUE_KEY}-test-report.md" 2>/dev/null || echo "(report not found)"
        echo "::endgroup::"

    - name: Upload test execution report
      uses: actions/upload-artifact@v4
      if: always() && steps.count_specs.outputs.SPEC_COUNT != '0'
      with:
        # Name ends with -test-report-md so post-results-to-jira.yml picks it up
        name: cypress-test-report-md
        path: qa-framework/reports/
        retention-days: 30
