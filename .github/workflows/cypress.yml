name: Cypress Tests
on:
  push:
    branches: [ main, master, dev, auto/** ]
    paths:
      - 'Cypress/**'
      - '.github/workflows/cypress.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'Cypress/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to test against'
        required: false
        default: 'dev'

jobs:
  test-cypress:
    name: Cypress E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Cypress binary
      run: npx cypress install

    - name: "DEBUG: Environment info"
      run: |
        echo "::group::Environment"
        echo "Node: $(node -v)"
        echo "npm:  $(npm -v)"
        npx cypress version
        echo "OS:   ${{ runner.os }}"
        echo "Ref:  ${{ inputs.ref || github.ref }}"
        echo "SHA:  ${{ github.sha }}"
        echo "Run:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "::endgroup::"

    - name: Count runnable specs
      id: count_specs
      run: |
        # Exclude .notimplemented stubs — they are skipped intentionally
        SPEC_COUNT=$(find Cypress/cypress/e2e -name "*.cy.ts" ! -name "*.notimplemented.cy.ts" 2>/dev/null | wc -l | tr -d ' ')
        echo "SPEC_COUNT=$SPEC_COUNT" >> "$GITHUB_OUTPUT"

        echo "::group::Cypress specs found ($SPEC_COUNT runnable)"
        find Cypress/cypress/e2e -name "*.cy.ts" ! -name "*.notimplemented.cy.ts" 2>/dev/null | sort || echo "(none)"
        echo "---"
        echo "Ignored stubs:"
        find Cypress/cypress/e2e -name "*.notimplemented.cy.ts" 2>/dev/null | sort || echo "(none)"
        echo "::endgroup::"
        echo "Runnable Cypress specs found: $SPEC_COUNT"

    - name: "Pre-flight: validate env vars and fixtures"
      run: |
        echo "::group::Env Validation"
        node -e "
          const fs = require('fs');
          const required = ['username', 'password', 'REQRES_API_KEY'];
          const envPath = 'Cypress/cypress.env.json';
          if (fs.existsSync(envPath)) {
            const env = JSON.parse(fs.readFileSync(envPath, 'utf8'));
            required.forEach(k => {
              if (env[k]) {
                console.log('  OK:   ' + k + ' is set');
              } else {
                console.log('  WARN: ' + k + ' missing in cypress.env.json (cypress.config.ts default will apply)');
              }
            });
          } else {
            console.log('::warning::No Cypress/cypress.env.json found — all env vars will use built-in defaults');
          }
          const fixtureDir = 'Cypress/cypress/fixtures';
          const required_fixtures = ['users.json', 'test.txt', 'checkout-user.json'];
          if (fs.existsSync(fixtureDir)) {
            required_fixtures.forEach(f => {
              const exists = fs.existsSync(fixtureDir + '/' + f);
              console.log('  FIXTURE ' + (exists ? 'OK:   ' : 'WARN: ') + f + (exists ? ' exists' : ' missing (will be auto-created by cypress.config.ts)'));
            });
          } else {
            console.log('  WARN: fixtures directory not found — will be created at runtime');
          }
        "
        echo "::endgroup::"

    - name: "Resilience lint: no raw cy.visit() or cy.request()"
      run: |
        node -e "
        const fs = require('fs'), path = require('path');
        const violations = [];
        function scan(dir) {
          if (!fs.existsSync(dir)) return;
          for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
            const full = path.join(dir, e.name);
            if (e.isDirectory()) { scan(full); continue; }
            if (!e.name.endsWith('.ts')) continue;
            fs.readFileSync(full, 'utf8').split('\n').forEach((line, i) => {
              if (/\bcy\.(visit|request)\(/.test(line) && !/^\s*\/\//.test(line))
                violations.push(full + ':' + (i + 1) + ':  ' + line.trim());
            });
          }
        }
        scan('Cypress/cypress/e2e');
        scan('Cypress/cypress/pages');
        if (violations.length) {
          console.error('LINT FAIL: Raw cy.visit() or cy.request() detected.');
          console.error('Use cy.safeVisit() and cy.apiRequest() instead.\n');
          violations.forEach(v => console.error(v));
          process.exit(1);
        }
        console.log('Resilience lint: OK — no raw cy.visit() or cy.request() found.');
        "

    - name: "Fixture validation: all cy.fixture() calls must have @requiredFixtures"
      run: |
        node -e "
        const fs = require('fs'), path = require('path');
        const FIXTURE_CALL = /cy\.fixture[<(][^)'"]*['\"]([\w.\-/]+)['\"][\s\S]*?[)>]/g;
        const FIXTURE_SIMPLE = /cy\.fixture\(['\"]([\w.\-/]+)['\"]|cy\.fixture<[^>]*>\(['\"]([\w.\-/]+)['\"]/g;
        const SELECT_FILE = /selectFile\(['\"](cypress\/fixtures\/[\w.\-/]+)['\"]|\.selectFile\('([^']+)'\)/g;
        const META_RE = /@requiredFixtures:\s*(\[[^\]]+\])/;
        const violations = [];
        function scan(dir) {
          if (!fs.existsSync(dir)) return;
          for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
            const full = path.join(dir, e.name);
            if (e.isDirectory()) { scan(full); continue; }
            if (!e.name.endsWith('.cy.ts')) continue;
            const src = fs.readFileSync(full, 'utf8');
            const used = new Set();
            let m;
            FIXTURE_SIMPLE.lastIndex = 0;
            while ((m = FIXTURE_SIMPLE.exec(src)) !== null) {
              const name = m[1] || m[2];
              if (name) used.add(name.includes('.') ? name : name + '.json');
            }
            SELECT_FILE.lastIndex = 0;
            while ((m = SELECT_FILE.exec(src)) !== null) {
              const raw = m[1] || m[2] || '';
              const base = raw.split('/').pop();
              if (base) used.add(base.includes('.') ? base : base + '.json');
            }
            if (used.size === 0) continue;
            const metaMatch = META_RE.exec(src);
            const declared = new Set();
            if (metaMatch) {
              try { JSON.parse(metaMatch[1]).forEach(f => declared.add(f)); } catch {}
            }
            for (const f of used) {
              if (!declared.has(f)) {
                violations.push(path.relative(process.cwd(), full) + ': uses fixture \"' + f + '\" but is missing // @requiredFixtures: [\"' + f + '\"]');
              }
            }
          }
        }
        scan('Cypress/cypress/e2e');
        if (violations.length) {
          console.error('FIXTURE VALIDATION FAIL: undeclared fixture(s) found.');
          console.error('Add // @requiredFixtures: [...] to the top of these files:\n');
          violations.forEach(v => console.error(v));
          process.exit(1);
        }
        console.log('Fixture validation: OK — all cy.fixture() calls are declared.');
        "

    - name: Run Cypress tests
      if: steps.count_specs.outputs.SPEC_COUNT != '0'
      run: |
        mkdir -p Cypress/cypress/reports
        npx cypress run --config-file Cypress/cypress.config.ts

    - name: "DEBUG: Cypress results"
      if: always() && steps.count_specs.outputs.SPEC_COUNT != '0'
      run: |
        echo "::group::Cypress reports directory"
        ls -la Cypress/cypress/reports/ 2>/dev/null || echo "(reports dir missing)"
        echo "::endgroup::"
        echo "::group::Mochawesome JSON summary"
        MOCH_FILE=""
        if [[ -f "Cypress/cypress/reports/mochawesome.json" ]]; then
          MOCH_FILE="Cypress/cypress/reports/mochawesome.json"
        elif [[ -f "Cypress/cypress/reports/mochawesome/mochawesome.json" ]]; then
          MOCH_FILE="Cypress/cypress/reports/mochawesome/mochawesome.json"
        fi
        if [[ -n "$MOCH_FILE" ]]; then
          echo "File: $MOCH_FILE ($(wc -c < "$MOCH_FILE") bytes)"
          cat "$MOCH_FILE" | jq '{passes: .stats.passes, failures: .stats.failures, pending: .stats.pending, duration: .stats.duration}' 2>/dev/null || \
            echo "Partial JSON:" && head -c 2000 "$MOCH_FILE"
        else
          echo "::warning::No mochawesome.json found — check reporter config"
        fi
        echo "::endgroup::"

    - name: Warn — no spec files found
      if: steps.count_specs.outputs.SPEC_COUNT == '0'
      run: |
        echo "::warning::No runnable Cypress specs found. Copilot must generate tests first."
        echo "The CI run will be marked neutral (not a failure) — Jira will NOT be transitioned to Done."
        # Exit with 0 so the workflow is marked success (neutral) rather than failure.
        # post-results-to-jira.yml will see 0 passing tests and skip the Done transition.
        exit 0

    - name: Upload Cypress videos
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.count_specs.outputs.SPEC_COUNT != '0' }}
      with:
        name: cypress-videos
        path: Cypress/cypress/videos/
        retention-days: 30

    - name: Upload Cypress screenshots
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.count_specs.outputs.SPEC_COUNT != '0' }}
      with:
        name: cypress-screenshots
        path: Cypress/cypress/screenshots/
        retention-days: 30

    - name: Upload Cypress results JSON
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.count_specs.outputs.SPEC_COUNT != '0' }}
      with:
        # Name ends with -test-results-json so post-results-to-jira.yml picks it up
        name: cypress-test-results-json
        path: Cypress/cypress/reports/
        retention-days: 30
