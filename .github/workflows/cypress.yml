name: Cypress Tests
on:
  push:
    branches: [ main, master, dev, auto/** ]
    paths:
      - 'Cypress/**'
      - '.github/workflows/cypress.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'Cypress/**'

jobs:
  test-cypress:
    name: Cypress E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Cypress binary
      run: npx cypress install

    - name: Run Cypress tests
      run: |
        # Skip if no spec files exist yet
        SPEC_COUNT=$(find Cypress/cypress/e2e -name "*.cy.ts" 2>/dev/null | wc -l)
        if [[ "$SPEC_COUNT" -eq 0 ]]; then
          echo "No Cypress specs found — skipping run"
          exit 0
        fi
        mkdir -p Cypress/cypress/results
        npx cypress run --config-file Cypress/cypress.config.ts

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cypress-playwright-report
        path: Cypress/cypress/videos/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cypress-test-results-json
        path: Cypress/cypress/results/results.json
        retention-days: 30
